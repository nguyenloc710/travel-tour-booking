# Pipeline phía backend.
#
# Kích hoạt khi sửa `api/` HOẶC `contracts/` — sửa contracts phải chạy CẢ HAI
# pipeline, vì cả hai bên đều sinh code từ cùng một `openapi.yaml` (docs/10 mục 2).
# Sửa `web/` KHÔNG kích hoạt pipeline này: đó là tiêu chí ra số 7 của cổng G2.
name: api

# GitHub Actions không hỗ trợ neo YAML (&/*), nên danh sách đường dẫn phải
# viết lặp hai lần. Sửa một chỗ thì nhớ sửa chỗ kia.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'contracts/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'contracts/**'
      - '.github/workflows/api.yml'

concurrency:
  # Đẩy commit mới lên cùng một PR thì huỷ lượt chạy cũ — không xếp hàng chờ.
  group: api-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Testcontainers dựng Postgres thật; runner ubuntu có sẵn Docker daemon.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # ADR-010 gộp bốn module thành một: `archTest` không còn tồn tại, và
      # cùng với nó là sáu bài test ranh giới. Ranh giới nay là quy ước đọc
      # được, không phải bước CI — cái mất đó ghi thẳng trong ADR-010.
      - name: Build và test
        run: ./gradlew build
        working-directory: api

      # Interface Java sinh từ spec: controller `implements` nó, nên spec đổi mà
      # controller quên sửa là lỗi biên dịch — bước trên đã bắt. Bước này chỉ
      # xác nhận việc sinh code tự nó chạy được trên máy sạch.
      - name: Sinh lại interface từ contracts/openapi.yaml
        run: ./gradlew contractsGenerate
        working-directory: api

      - name: Báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-test-api
          path: api/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
