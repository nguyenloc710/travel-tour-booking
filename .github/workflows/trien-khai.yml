# Pipeline triển khai — docs/34 mục 5.
#
# Đường đi: đẩy lên main → build ba ảnh → đẩy lên GHCR → SSH vào VPS → pull và
# up. Container mới khởi động, Flyway chạy, rồi mới nhận traffic (mục 4).
#
# KHÔNG tự chạy lại test. Bảo đảm "CI xanh mới được triển khai" đến từ **branch
# protection** của nhánh main: ba check `api`, `web`, `tai-lieu` phải được đặt
# là bắt buộc thì code mới vào được main. Chưa bật cài đặt đó thì file này vẫn
# chạy, nhưng câu "không bỏ qua CI" của mục 7 chỉ còn là lời hứa suông.
name: trien-khai

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'contracts/**'
      - 'deploy/**'
      - '.github/workflows/trien-khai.yml'
  # Để triển khai lại đúng một commit cũ mà không cần đẩy commit rỗng — chính là
  # cách lùi của mục 6 khi migration không đổi lược đồ.
  workflow_dispatch:

concurrency:
  group: trien-khai
  # KHÔNG huỷ giữa chừng. Huỷ một lượt triển khai đang chạy có thể để lại máy
  # chủ ở trạng thái nửa vời — vài container đã đổi ảnh, vài cái chưa.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:

  # ------------------------------------------------------------------- ảnh
  anh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # Cần để đẩy ảnh lên GHCR bằng GITHUB_TOKEN — không phải tạo PAT riêng.
      packages: write

    strategy:
      # Một ảnh hỏng thì hai ảnh kia dừng theo: triển khai nửa bộ còn tệ hơn
      # không triển khai gì.
      fail-fast: true
      matrix:
        include:
          - ten: travel-api
            dockerfile: api/Dockerfile
          - ten: travel-site
            dockerfile: web/apps/site/Dockerfile
          - ten: travel-admin
            dockerfile: web/apps/admin/Dockerfile

    steps:
      # Bước ĐẦU TIÊN, trước cả checkout: hỏng ở đây tốn 5 giây, hỏng ở
      # `next build` tốn 8 phút.
      #
      # Biến rỗng KHÔNG rơi về mặc định của `ARG` trong Dockerfile — truyền
      # `--build-arg X=` là ghi đè bằng chuỗi rỗng. Không chặn ở đây thì lỗi
      # hiện ra tận giữa `next build`, dưới dạng
      #     Expected http | https, received 
      # một câu không nhắc gì tới GitHub Variables, nơi thật sự thiếu.
      - name: Năm Variables phải có giá trị
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          MEDIA_PROTOCOL: ${{ vars.MEDIA_PROTOCOL }}
          MEDIA_HOST: ${{ vars.MEDIA_HOST }}
          MEDIA_PORT: ${{ vars.MEDIA_PORT }}
        run: |
          thieu=""
          # Năm dòng thẳng thay vì một vòng lặp: bản đầu dùng `eval "v=$b"`,
          # thứ gán TÊN biến chứ không gán GIÁ TRỊ, nên guard luôn xanh kể cả
          # khi thiếu. Chỗ này không đáng khéo.
          [ -n "$PUBLIC_SITE_URL" ] || thieu="$thieu PUBLIC_SITE_URL"
          [ -n "$PUBLIC_API_URL" ]  || thieu="$thieu PUBLIC_API_URL"
          [ -n "$MEDIA_PROTOCOL" ]  || thieu="$thieu MEDIA_PROTOCOL"
          [ -n "$MEDIA_HOST" ]      || thieu="$thieu MEDIA_HOST"
          [ -n "$MEDIA_PORT" ]      || thieu="$thieu MEDIA_PORT"
          if [ -n "$thieu" ]; then
            echo "Thiếu GitHub Variables:$thieu" >&2
            echo "Đặt ở Settings → Secrets and variables → Actions → tab Variables." >&2
            echo "Chúng bị nướng vào ảnh lúc build nên không được để trống — docs/34 mục 5.3." >&2
            exit 1
          fi
          echo "Năm Variables đủ. Site: $PUBLIC_SITE_URL · API: $PUBLIC_API_URL"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      # Tên chủ repo có thể có chữ hoa; tên ảnh Docker thì không được.
      - name: Tên ảnh đầy đủ
        id: ten
        run: echo "anh=${{ env.REGISTRY }}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.ten }}" >> "$GITHUB_OUTPUT"

      # Bối cảnh build là GỐC REPO cho cả ba ảnh — cả ba đều cần
      # contracts/openapi.yaml, thứ nằm ngoài thư mục của chính chúng.
      #
      # Thẻ duy nhất là commit SHA. Không có `latest`: mục 7 cấm, vì nhìn vào
      # máy chủ phải biết được chính xác commit nào đang chạy.
      #
      # `buildcache` là thẻ phụ chỉ chứa lớp cache, không bao giờ được triển
      # khai. Thiếu nó thì mỗi lượt build lại tải lại toàn bộ phụ thuộc Gradle
      # và pnpm từ đầu.
      - name: Build và đẩy
        run: |
          docker buildx build \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ steps.ten.outputs.anh }}:${{ github.sha }}" \
            --cache-from "type=registry,ref=${{ steps.ten.outputs.anh }}:buildcache" \
            --cache-to "type=registry,ref=${{ steps.ten.outputs.anh }}:buildcache,mode=max" \
            --build-arg "NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}" \
            --build-arg "NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL }}" \
            --build-arg "NEXT_PUBLIC_STORAGE_PROTOCOL=${{ vars.MEDIA_PROTOCOL }}" \
            --build-arg "NEXT_PUBLIC_STORAGE_HOST=${{ vars.MEDIA_HOST }}" \
            --build-arg "NEXT_PUBLIC_STORAGE_PORT=${{ vars.MEDIA_PORT }}" \
            --push \
            .

  # ------------------------------------------------------------- triển khai
  #
  # Đăng nhập bằng MẬT KHẨU, không bằng khoá — VPS của dự án này chỉ có sẵn
  # user/password. Ba hệ quả phải sống chung:
  #
  #   1. Cần `sshpass`, vì `ssh` cố tình từ chối đọc mật khẩu từ stdin hay từ
  #      tham số. Đây là một phụ thuộc của runner, không phải của sản phẩm.
  #   2. `VPS_KNOWN_HOSTS` chuyển từ "nên có" sang **bắt buộc**. Với khoá thì
  #      gặp máy chủ giả cũng chỉ hỏng lượt triển khai; với mật khẩu thì ta
  #      GỬI LUÔN MẬT KHẨU cho máy giả đó. Không bao giờ thay bằng
  #      `StrictHostKeyChecking=no`.
  #   3. `VPS_PASSWORD` là mật khẩu đăng nhập máy chủ, dùng được ở mọi nơi chứ
  #      không riêng việc triển khai. Ai sửa được workflow là có đường đọc nó.
  #      Ngày muốn siết: sinh một cặp khoá riêng cho triển khai, thêm khoá công
  #      khai vào máy chủ, đổi hai bước dưới về `ssh -i`. Mật khẩu của người
  #      vẫn giữ nguyên — hai đường đăng nhập không loại trừ nhau.
  trien-khai:
    needs: anh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    env:
      # Tắt hẳn xác thực bằng khoá: không có khoá nào để thử, và để `ssh` thử
      # rồi mới rơi về mật khẩu chỉ làm log khó đọc lúc hỏng.
      SSH_OPT: -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=password -o ConnectTimeout=15
      DICH: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      CONG: ${{ vars.VPS_PORT || 22 }}
      THU_MUC: ${{ vars.VPS_DIR || '/opt/travel' }}

    steps:
      - uses: actions/checkout@v4

      - name: sshpass và dấu vân tay máy chủ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          # Lấy giá trị này MỘT LẦN trên máy bạn, ở một mạng bạn tin được:
          #     ssh-keyscan -p <cổng> <host>
          # rồi cất nguyên văn thành bí mật VPS_KNOWN_HOSTS. Đừng chạy
          # ssh-keyscan bên trong pipeline: làm thế là tin bất cứ ai trả lời.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || {
            echo "VPS_KNOWN_HOSTS rỗng. Với đăng nhập bằng mật khẩu thì đây là" >&2
            echo "thứ duy nhất ngăn pipeline gửi mật khẩu cho một máy chủ giả." >&2
            exit 1
          }

      # Bốn file cấu hình sống trong repo nhưng chạy trên máy chủ. Chép cả bốn mỗi
      # lượt để sửa chúng chỉ cần một commit, không phải sửa tay trên VPS. Máy chủ
      # tự chọn dùng file phủ nào, qua `COMPOSE_FILE` trong `.env` của nó.
      #
      # KHÔNG chép `.env`. File đó do bạn tạo một lần trên máy chủ và không bao
      # giờ rời khỏi nó — docs/34 mục 3.1.
      - name: Chép bộ file compose lên máy chủ
        env:
          # `sshpass -e` đọc mật khẩu từ biến môi trường này. Dùng `-e` chứ
          # KHÔNG dùng `-p <mật khẩu>`: tham số dòng lệnh hiện trong `ps` của
          # mọi tiến trình khác trên runner.
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh $SSH_OPT -p "$CONG" "$DICH" "mkdir -p '$THU_MUC'"
          sshpass -e scp $SSH_OPT -P "$CONG" \
            deploy/compose.prod.yaml deploy/compose.ip.yaml \
            deploy/compose.tenmien.yaml deploy/Caddyfile \
            "$DICH:$THU_MUC/"

      # Token registry đi qua stdin của ssh, không qua tham số dòng lệnh: tham
      # số hiện trong `ps` của mọi tiến trình khác trên MÁY CHỦ.
      #
      # Token này chỉ sống trong lượt chạy này, nên máy chủ KHÔNG phải cất một
      # PAT dài hạn để pull ảnh.
      - name: Pull và up
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sshpass -e ssh $SSH_OPT -p "$CONG" "$DICH" \
            "set -e
             cd '$THU_MUC'
             if [ ! -f .env ]; then
               echo \"Khong co $THU_MUC/.env tren may chu.\" >&2
               echo \"Tao no tu deploy/.env.prod.example roi chmod 600 — docs/34 muc 3.1.\" >&2
               exit 1
             fi
             docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
             # TAG ghi đè giá trị trong .env: một dòng, chạy lại được.
             sed -i '/^TAG=/d' .env && echo 'TAG=${{ github.sha }}' >> .env
             grep -q '^COMPOSE_FILE=' .env || {
               echo \"Thieu COMPOSE_FILE trong $THU_MUC/.env — khong biet chay hinh dang nao.\" >&2
               echo \"Dat compose.prod.yaml:compose.ip.yaml khi chua co ten mien,\" >&2
               echo \"hoac compose.prod.yaml:compose.tenmien.yaml khi da co.\" >&2
               exit 1
             }
             # Khong truyen -f: compose tu doc COMPOSE_FILE trong .env, nen hinh
             # dang chay la thuoc tinh cua MAY CHU chu khong cua pipeline.
             docker compose pull
             docker compose up -d --remove-orphans
             docker logout ${{ env.REGISTRY }}
             # Dọn ảnh cũ, giữ lại thứ đang dùng. Không có dòng này thì đĩa VPS
             # đầy dần theo mỗi lần triển khai, và nó đầy vào lúc không ai nhìn.
             docker image prune -af --filter 'until=168h'"

      - name: Đang chạy commit nào
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh $SSH_OPT -p "$CONG" "$DICH" \
            "cd '$THU_MUC' && docker compose ps"
