# Pipeline triển khai — docs/34 mục 5.
#
# Đường đi: đẩy lên main → build ba ảnh → đẩy lên GHCR → SSH vào VPS → pull và
# up. Container mới khởi động, Flyway chạy, rồi mới nhận traffic (mục 4).
#
# KHÔNG tự chạy lại test. Bảo đảm "CI xanh mới được triển khai" đến từ **branch
# protection** của nhánh main: ba check `api`, `web`, `tai-lieu` phải được đặt
# là bắt buộc thì code mới vào được main. Chưa bật cài đặt đó thì file này vẫn
# chạy, nhưng câu "không bỏ qua CI" của mục 7 chỉ còn là lời hứa suông.
name: trien-khai

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'contracts/**'
      - 'deploy/**'
      - '.github/workflows/trien-khai.yml'
  # Để triển khai lại đúng một commit cũ mà không cần đẩy commit rỗng — chính là
  # cách lùi của mục 6 khi migration không đổi lược đồ.
  workflow_dispatch:

concurrency:
  group: trien-khai
  # KHÔNG huỷ giữa chừng. Huỷ một lượt triển khai đang chạy có thể để lại máy
  # chủ ở trạng thái nửa vời — vài container đã đổi ảnh, vài cái chưa.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:

  # ------------------------------------------------------------------- ảnh
  anh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # Cần để đẩy ảnh lên GHCR bằng GITHUB_TOKEN — không phải tạo PAT riêng.
      packages: write

    strategy:
      # Một ảnh hỏng thì hai ảnh kia dừng theo: triển khai nửa bộ còn tệ hơn
      # không triển khai gì.
      fail-fast: true
      matrix:
        include:
          - ten: travel-api
            dockerfile: api/Dockerfile
          - ten: travel-site
            dockerfile: web/apps/site/Dockerfile
          - ten: travel-admin
            dockerfile: web/apps/admin/Dockerfile

    steps:
      # Bước ĐẦU TIÊN, trước cả checkout: hỏng ở đây tốn 5 giây, hỏng ở
      # `next build` tốn 8 phút.
      #
      # Biến rỗng KHÔNG rơi về mặc định của `ARG` trong Dockerfile — truyền
      # `--build-arg X=` là ghi đè bằng chuỗi rỗng. Không chặn ở đây thì lỗi
      # hiện ra tận giữa `next build`, dưới dạng
      #     Expected http | https, received 
      # một câu không nhắc gì tới GitHub Variables, nơi thật sự thiếu.
      - name: Năm Variables phải có giá trị
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          MEDIA_PROTOCOL: ${{ vars.MEDIA_PROTOCOL }}
          MEDIA_HOST: ${{ vars.MEDIA_HOST }}
          MEDIA_PORT: ${{ vars.MEDIA_PORT }}
        run: |
          thieu=""
          # Năm dòng thẳng thay vì một vòng lặp: bản đầu dùng `eval "v=$b"`,
          # thứ gán TÊN biến chứ không gán GIÁ TRỊ, nên guard luôn xanh kể cả
          # khi thiếu. Chỗ này không đáng khéo.
          [ -n "$PUBLIC_SITE_URL" ] || thieu="$thieu PUBLIC_SITE_URL"
          [ -n "$PUBLIC_API_URL" ]  || thieu="$thieu PUBLIC_API_URL"
          [ -n "$MEDIA_PROTOCOL" ]  || thieu="$thieu MEDIA_PROTOCOL"
          [ -n "$MEDIA_HOST" ]      || thieu="$thieu MEDIA_HOST"
          [ -n "$MEDIA_PORT" ]      || thieu="$thieu MEDIA_PORT"
          if [ -n "$thieu" ]; then
            echo "Thiếu GitHub Variables:$thieu" >&2
            echo "Đặt ở Settings → Secrets and variables → Actions → tab Variables." >&2
            echo "Chúng bị nướng vào ảnh lúc build nên không được để trống — docs/34 mục 5.3." >&2
            exit 1
          fi
          echo "Năm Variables đủ. Site: $PUBLIC_SITE_URL · API: $PUBLIC_API_URL"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      # Tên chủ repo có thể có chữ hoa; tên ảnh Docker thì không được.
      - name: Tên ảnh đầy đủ
        id: ten
        run: echo "anh=${{ env.REGISTRY }}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.ten }}" >> "$GITHUB_OUTPUT"

      # Bối cảnh build là GỐC REPO cho cả ba ảnh — cả ba đều cần
      # contracts/openapi.yaml, thứ nằm ngoài thư mục của chính chúng.
      #
      # Thẻ duy nhất là commit SHA. Không có `latest`: mục 7 cấm, vì nhìn vào
      # máy chủ phải biết được chính xác commit nào đang chạy.
      #
      # `buildcache` là thẻ phụ chỉ chứa lớp cache, không bao giờ được triển
      # khai. Thiếu nó thì mỗi lượt build lại tải lại toàn bộ phụ thuộc Gradle
      # và pnpm từ đầu.
      - name: Build và đẩy
        run: |
          docker buildx build \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ steps.ten.outputs.anh }}:${{ github.sha }}" \
            --cache-from "type=registry,ref=${{ steps.ten.outputs.anh }}:buildcache" \
            --cache-to "type=registry,ref=${{ steps.ten.outputs.anh }}:buildcache,mode=max" \
            --build-arg "NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}" \
            --build-arg "NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL }}" \
            --build-arg "NEXT_PUBLIC_STORAGE_PROTOCOL=${{ vars.MEDIA_PROTOCOL }}" \
            --build-arg "NEXT_PUBLIC_STORAGE_HOST=${{ vars.MEDIA_HOST }}" \
            --build-arg "NEXT_PUBLIC_STORAGE_PORT=${{ vars.MEDIA_PORT }}" \
            --push \
            .

  # ------------------------------------------------------------- triển khai
  #
  # Dùng `appleboy/ssh-action` và `appleboy/scp-action` — cùng khuôn với
  # `comic-social-network-be`, repo mà `docs/15` nói là mượn khuôn đã chạy thật.
  #
  # Bản trước tự gọi `ssh`/`scp` với `sshpass` và ghim dấu vân tay máy chủ qua
  # secret `VPS_KNOWN_HOSTS`. Chặt hơn, nhưng đắt: mỗi lần đổi IP hoặc cài lại
  # máy chủ là phải lấy lại giá trị đó, và khi sai thì OpenSSH báo
  # "Host key verification failed" — câu dùng chung cho cả "host lạ" lẫn
  # "khoá đã đổi", nên rất khó đoán.
  #
  # Đánh đổi đã chấp nhận có ý thức: hai action này KHÔNG kiểm danh tính máy
  # chủ, nên mỗi lượt triển khai gửi mật khẩu VPS cho bất cứ máy nào trả lời ở
  # địa chỉ đó. Ngày muốn siết lại thì cách rẻ nhất không phải quay về
  # `known_hosts` mà là chuyển sang khoá SSH: thêm khoá công khai vào
  # `authorized_keys`, rồi đổi `password:` thành `key:` ở hai bước dưới. Lúc đó
  # máy chủ giả không lấy được gì, và không cần ghim vân tay nữa.
  trien-khai:
    needs: anh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      # Bốn file cấu hình sống trong repo nhưng chạy trên máy chủ. Chép cả bốn
      # mỗi lượt để sửa chúng chỉ cần một commit, không phải sửa tay trên VPS.
      #
      # KHÔNG chép `.env`. File đó do bạn tạo một lần trên máy chủ và không bao
      # giờ rời khỏi nó — docs/34 mục 3.1. Thư mục đích vì thế đã tồn tại sẵn:
      # `.env` phải nằm ở đó trước khi lượt triển khai đầu tiên chạy.
      #
      # `strip_components: 1` bỏ tiền tố `deploy/`, để file nằm thẳng trong
      # /opt/travel chứ không thành /opt/travel/deploy.
      - name: Chép bộ file compose lên máy chủ
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          source: "deploy/compose.prod.yaml,deploy/compose.ip.yaml,deploy/compose.tenmien.yaml,deploy/Caddyfile"
          target: ${{ vars.VPS_DIR || '/opt/travel' }}
          strip_components: 1

      # Token registry đi qua `envs:` chứ không nhúng vào chuỗi script: nhúng
      # thẳng là nó hiện trong `ps` của mọi tiến trình khác trên máy chủ.
      #
      # Token chỉ sống trong lượt chạy này, nên máy chủ KHÔNG phải cất một PAT
      # dài hạn để pull ảnh.
      - name: Pull và up
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANH_TAG: ${{ github.sha }}
          THU_MUC: ${{ vars.VPS_DIR || '/opt/travel' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ vars.VPS_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,ANH_TAG,THU_MUC
          script: |
            set -e
            cd "$THU_MUC"

            if [ ! -f .env ]; then
              echo "Khong co $THU_MUC/.env tren may chu." >&2
              echo "Tao no tu deploy/.env.prod.example roi chmod 600 — docs/34 muc 3.1." >&2
              exit 1
            fi

            if ! grep -q '^COMPOSE_FILE=' .env; then
              echo "Thieu COMPOSE_FILE trong $THU_MUC/.env — khong biet chay hinh dang nao." >&2
              echo "Dat compose.prod.yaml:compose.ip.yaml khi chua co ten mien," >&2
              echo "hoac compose.prod.yaml:compose.tenmien.yaml khi da co." >&2
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Thẻ ảnh = commit SHA, không bao giờ `latest`: nhìn vào máy chủ
            # phải biết chính xác commit nào đang chạy — docs/34 mục 7.
            sed -i '/^TAG=/d' .env
            echo "TAG=$ANH_TAG" >> .env

            # Không truyền -f: compose tự đọc COMPOSE_FILE trong .env, nên hình
            # dạng chạy là thuộc tính của MÁY CHỦ chứ không của pipeline.
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout ghcr.io

            # Dọn ảnh cũ, giữ lại thứ đang dùng. Không có dòng này thì đĩa VPS
            # đầy dần theo mỗi lần triển khai, và nó đầy vào lúc không ai nhìn.
            docker image prune -af --filter 'until=168h'

            docker compose ps
