spring:
  application:
    name: travel-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travel}
    username: ${DB_USER:travel}
    password: ${DB_PASSWORD:travel}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migration chạy lúc triển khai, TRƯỚC khi container nhận traffic — docs/12 mục 8.
    baseline-on-migrate: false

  jpa:
    # Flyway sở hữu lược đồ. Hibernate CHỈ được kiểm, không được tạo hay sửa —
    # khuôn mượn của dự án trước (docs/15 mục 2). Để ddl-auto sinh bảng là có
    # hai nguồn sự thật cho lược đồ, và chúng sẽ lệch nhau.
    hibernate:
      ddl-auto: validate
    # Không mở phiên JPA suốt vòng đời request: truy vấn lười nổ ở tầng view là
    # thứ không ai thấy cho tới khi nó chậm trên production.
    open-in-view: false

  jackson:
    # Trường rỗng bỏ hẳn khỏi JSON, không trả null — docs/13 mục 4.
    default-property-inclusion: non_null

travel:
  cors:
    # Gốc được phép gọi API từ trình duyệt. Mặc định là hai cổng dev; production
    # đặt CORS_ALLOWED_ORIGINS thành tên miền thật.
    #
    # KHÔNG dùng `*`: bề mặt quản trị xác thực bằng cookie nên CORS phải cho gửi
    # kèm credentials, và đặc tả cấm `*` đi cùng credentials — xem SecurityConfig.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

  bootstrap-admin:
    # Tài khoản ADMIN đầu tiên, tạo lúc khởi động nếu CSDL chưa từng có ADMIN
    # nào — BootstrapAdminRunner. Cần vì hợp đồng API không có đường tạo người
    # dùng: CSDL trống nghĩa là không ai đăng nhập được, kể cả để tạo người khác.
    #
    # Để TRỐNG ở dev và test — `seed-dev.sql` đã có sẵn tài khoản. Chỉ đặt ở bản
    # chạy thật, và đặt qua biến môi trường, không viết thẳng vào file này.
    #
    # Đổi hai giá trị này rồi khởi động lại KHÔNG đổi được mật khẩu của tài
    # khoản đã tạo. Đó là chủ ý — xem chú thích lớp BootstrapAdminRunner.
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_NAME:Quản trị viên}

  storage:
    # Địa chỉ CÔNG KHAI của kho ảnh — cái đi vào thân phản hồi cho trình duyệt.
    # `media_asset.path` lưu đường dẫn tương đối, giá trị này là phần đầu ghép
    # vào (ADR-011 mục 2, docs/12 mục 4.6).
    #
    # Đây KHÔNG phải endpoint nội bộ. Hai địa chỉ tách biệt có chủ ý (docs/15
    # mục 2): SigV4 ký cả host, nên đường ghi phải ký bằng địa chỉ công khai —
    # ký bằng địa chỉ nội bộ thì trình duyệt nhận 403 mà không nói vì sao. Ở dev
    # hai giá trị trùng nhau, nên lỗi này ẩn hoàn toàn cho tới lúc triển khai.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/travel-media}

# Swagger UI: http://localhost:8080/swagger-ui.html
# Spec sinh từ code: http://localhost:8080/v3/api-docs
#
# Spec này KHÔNG phải `contracts/openapi.yaml`. Nó do springdoc đọc annotation
# trên controller mà sinh ra, nên hai bản có thể lệch nhau và không có gì báo.
# File trong `contracts/` vẫn là thứ dùng để sinh model Java và TS client.
#
# TẮT Ở BẢN CHẠY THẬT. Trang này liệt kê đủ cả bề mặt quản trị, và chế độ chạy
# bằng IP chưa có HTTPS — xem chú thích trong SecurityConfig.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    # Sắp theo thẻ và theo phương thức, không theo thứ tự quét được — thứ tự
    # quét đổi theo classpath và làm trang này khác nhau giữa hai lần chạy.
    tags-sorter: alpha
    operations-sorter: method

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    vn.travel.booking: DEBUG
