spring:
  application:
    name: travel-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travel}
    username: ${DB_USER:travel}
    password: ${DB_PASSWORD:travel}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migration chạy lúc triển khai, TRƯỚC khi container nhận traffic — docs/12 mục 8.
    baseline-on-migrate: false

  jpa:
    # Flyway sở hữu lược đồ. Hibernate CHỈ được kiểm, không được tạo hay sửa —
    # khuôn mượn của dự án trước (docs/15 mục 2). Để ddl-auto sinh bảng là có
    # hai nguồn sự thật cho lược đồ, và chúng sẽ lệch nhau.
    hibernate:
      ddl-auto: validate
    # Không mở phiên JPA suốt vòng đời request: truy vấn lười nổ ở tầng view là
    # thứ không ai thấy cho tới khi nó chậm trên production.
    open-in-view: false

  jackson:
    # Trường rỗng bỏ hẳn khỏi JSON, không trả null — docs/13 mục 4.
    default-property-inclusion: non_null

travel:
  cors:
    # Gốc được phép gọi API từ trình duyệt. Mặc định là hai cổng dev; production
    # đặt CORS_ALLOWED_ORIGINS thành tên miền thật.
    #
    # KHÔNG dùng `*`: bề mặt quản trị xác thực bằng cookie nên CORS phải cho gửi
    # kèm credentials, và đặc tả cấm `*` đi cùng credentials — xem SecurityConfig.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

  storage:
    # Địa chỉ CÔNG KHAI của kho ảnh — cái đi vào thân phản hồi cho trình duyệt.
    # `media_asset.path` lưu đường dẫn tương đối, giá trị này là phần đầu ghép
    # vào (ADR-011 mục 2, docs/12 mục 4.6).
    #
    # Đây KHÔNG phải endpoint nội bộ. Hai địa chỉ tách biệt có chủ ý (docs/15
    # mục 2): SigV4 ký cả host, nên đường ghi phải ký bằng địa chỉ công khai —
    # ký bằng địa chỉ nội bộ thì trình duyệt nhận 403 mà không nói vì sao. Ở dev
    # hai giá trị trùng nhau, nên lỗi này ẩn hoàn toàn cho tới lúc triển khai.
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/travel-media}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    vn.travel.booking: DEBUG
