# Phiên bản tập trung một chỗ. Đổi ở đây, không đổi rải rác trong module.
# Không thêm dependency mới mà chưa hỏi — CLAUDE.md quy tắc 8.

[versions]
mapstruct = "1.6.3"
java = "21"
springBoot = "4.1.1"
postgresql = "42.7.7"
testcontainers = "1.21.4"
archunit = "1.5.0"
openapiGenerator = "7.14.0"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
# Ba dependency của đợt 2 — docs/15 mục 4. Không cái nào là lựa chọn tự do:
#   · data-jpa   — docs/10 mục 6 chốt JPA cho CRUD quản trị
#   · security   — docs/13 mục 10 chốt phiên đăng nhập cho nhân viên
#   · mapstruct  — docs/15 mục 2, mượn khuôn của dự án trước: entity sang DTO
#                  luôn qua mapper sinh ra, không map tay trong service
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
# Spring Boot 4 tách autoconfiguration của Flyway ra module riêng: chỉ có
# flyway-core trên classpath thì migration KHÔNG chạy và cũng không báo gì.
# Phiên bản để BOM của Spring Boot quản, không tự ghim.
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }

archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }
