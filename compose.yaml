services:

  postgres:
    image: postgres:16
    container_name: travel-postgres
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      # Không đặt collation mặc định cho cả CSDL: mỗi locale một collation, đặt
      # mặc định là chọn sai cho một trong hai — docs/12 mục 1.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

# Ảnh postgres:16 chính thức đã có sẵn contrib (unaccent, pg_trgm) và ICU, nên
# hai collation "da-DK-x-icu" và "vi-VN-x-icu" dùng được ngay. Bản alpine cắt
# bớt ICU — không đổi sang alpine.
#
# Extension được bật bởi migration V1, không cài tay:
#   ./gradlew flywayMigrate   (hoặc để ứng dụng tự chạy lúc khởi động)
#
# Dữ liệu mồi cho dev:
#   psql postgresql://travel:travel@localhost:5432/travel -f api/scripts/seed-dev.sql
