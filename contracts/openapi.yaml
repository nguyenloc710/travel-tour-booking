openapi: 3.0.3

# Nguồn sự thật của hợp đồng API (ADR-002). Viết tay, review như review code.
#
# Thứ tự bắt buộc khi đổi — CLAUDE.md mục "Đổi hợp đồng API":
#   1. sửa file này          ← pull request riêng, có người duyệt
#   2. pnpm contracts:generate
#   3. sửa controller cho khớp interface mới
#   4. sửa frontend
#
# Quy ước ở docs/13-hop-dong-api.md. Ba điều hay sai nhất:
#   · market ở ĐƯỜNG DẪN, locale ở HEADER Accept-Language — không gộp
#   · tiền là đối tượng, `amount` là CHUỖI, API không định dạng
#   · lỗi trả MÃ kèm tham số, không trả câu tiếng người
#
# Phiên bản 0.1: chỉ một endpoint đọc, đủ để chứng minh spec-first sinh được cả
# interface Java lẫn TS client và cả hai bên biên dịch sạch (cổng G2).
#
# Phiên bản 0.2: lõi danh mục (G3) — listing sản phẩm và trang chi tiết.
# Phiên bản 0.3: điểm đến, và bộ lọc sản phẩm theo điểm đến.
# Phiên bản 0.4: chủ đề, lịch trình, khách sạn, ngày khởi hành, bài viết,
#                buổi thuyết trình — đủ danh mục đọc của docs/13 mục 9.1.
# Phiên bản 0.6: đường GHI của khách — tính giá xem trước, giữ chỗ, đặt tour,
#                tra đơn. Ba endpoint đầu đòi Idempotency-Key (docs/13 mục 7).
# Phiên bản 0.5: bề mặt QUẢN TRỊ — phiên đăng nhập và sửa bản dịch sản phẩm.
#                Khác bề mặt công khai ở bốn điểm (docs/13 mục 2): không có
#                market trong đường dẫn, trả MỌI bản dịch chứ không một, thấy cả
#                nội dung chưa xuất bản, và không bao giờ cache.

info:
  title: Travel Tour Booking API
  version: 0.7.0
  description: |
    API cho website bán tour du lịch Việt Nam, hai thị trường (DK, VN),
    hai ngôn ngữ (da, vi).

servers:
  - url: /
    description: Cùng gốc với ứng dụng

tags:
  - name: regions
    description: Miền — cấp phân loại địa lý trên cùng
  - name: products
    description: Sản phẩm — sáu loại, mỗi loại có bảng con riêng (ADR-005)
  - name: destinations
    description: Điểm đến — cấp phân loại dưới miền
  - name: themes
    description: Chủ đề — phân loại ngang, cắt qua miền và loại sản phẩm
  - name: posts
    description: Bài viết
  - name: lectures
    description: Buổi thuyết trình
  - name: booking
    description: |
      Giữ chỗ, tính giá và đặt tour. Mọi endpoint ở đây **không bao giờ được
      cache** và endpoint tạo ra hệ quả tính tiền đều đòi `Idempotency-Key`.
  - name: admin
    description: |
      Bề mặt quản trị. Yêu cầu phiên đăng nhập; quyền theo bốn vai trò của
      `docs/22` mục 2.1.

paths:
  /api/v1/{market}/regions:
    get:
      tags: [regions]
      operationId: listRegions
      summary: Danh sách miền kèm số sản phẩm
      description: |
        Số sản phẩm đếm theo **sản phẩm**, không cộng dồn từng điểm đến: một tour
        ghé Hà Nội, Hạ Long và Ninh Bình chỉ tính một lần cho miền Bắc.

        Đếm trong phạm vi `(market, locale)` đang xem. Miền không có sản phẩm nào
        đã xuất bản ở thị trường này vẫn trả về, với `productCount` bằng 0.

        Miền thiếu bản dịch cho locale yêu cầu thì **không xuất hiện** — chính
        sách không-fallback của `docs/02` mục 4.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Danh sách miền
          headers:
            Content-Language:
              schema: { type: string }
              description: Ngôn ngữ thực tế của nội dung trả về
            Vary:
              schema: { type: string }
              description: Luôn chứa Accept-Language
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Danh sách sản phẩm của một thị trường
      description: |
        Chỉ trả sản phẩm **đã xuất bản ở thị trường này** và **đã dịch sang locale
        đang xem**. Sản phẩm thiếu bản dịch biến mất hoàn toàn — không listing,
        không tìm kiếm, không hiện bản `da` thay thế (`docs/02` mục 4).

        `totalItems` đếm trong phạm vi `(market, locale)`, nên **hai locale ra hai
        con số khác nhau**. Đúng như thiết kế: frontend hiển thị đúng số này chứ
        không hardcode.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: region
          in: query
          required: false
          description: Slug miền **trong locale đang xem** — `nordvietnam` với `da`, `mien-bac` với `vi`.
          schema:
            type: string
        - name: destination
          in: query
          required: false
          description: |
            Slug điểm đến **trong locale đang xem**. Lọc theo điểm đến **chính**
            của sản phẩm, không lọc theo mọi điểm đến sản phẩm ghé qua — một
            tour xuyên Việt thuộc về một điểm đến khởi hành, không thuộc về tất cả.
          schema:
            type: string
        - name: theme
          in: query
          required: false
          description: |
            Slug chủ đề **trong locale đang xem**. **Lặp lại được** để lọc nhiều
            chủ đề: `?theme=trekking&theme=du-thuyen-song`. Không dùng dấu phẩy —
            dấu phẩy vỡ khi giá trị có chứa dấu phẩy (`docs/13` mục 6).

            Nhiều giá trị nghĩa là **HOẶC**: sản phẩm mang ít nhất một trong số đó.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: productType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductType'
        - name: q
          in: query
          required: false
          description: |
            Tìm trong tiêu đề, **không phân biệt dấu**: gõ `hoi an` ra `Hội An`,
            gõ `halong` ra `Hạ Long`. Bỏ dấu ở tầng CSDL bằng `f_unaccent`.
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          required: false
          description: |
            Mặc định `title,asc`. `title` sắp theo collation của locale đang xem
            (`da-DK-x-icu` xếp æ ø å **sau** z), sắp ở tầng CSDL chứ không ở Java.
          schema:
            $ref: '#/components/schemas/ProductSort'
        - name: page
          in: query
          required: false
          description: Đánh số từ 0. Phân trang theo offset — `docs/13` mục 6.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 60
            default: 24
      responses:
        '200':
          description: Một trang sản phẩm
          headers:
            Content-Language:
              schema: { type: string }
            Vary:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/destinations:
    get:
      tags: [destinations]
      operationId: listDestinations
      summary: Danh sách điểm đến kèm số sản phẩm
      description: |
        Sắp theo miền rồi tới thứ tự trong miền, để danh sách đọc được như một
        hành trình từ Bắc vào Nam chứ không phải một mớ theo bảng chữ cái.

        `productCount` đếm theo **điểm đến chính** của sản phẩm, trong phạm vi
        `(market, locale)` đang xem. Điểm đến chưa có sản phẩm nào vẫn trả về,
        với số bằng 0 — trang điểm đến vẫn có nội dung riêng để đọc.

        Điểm đến thiếu bản dịch cho locale yêu cầu thì **không xuất hiện**.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: region
          in: query
          required: false
          description: Lọc theo slug miền **của locale đang xem**.
          schema:
            type: string
      responses:
        '200':
          description: Danh sách điểm đến
          headers:
            Content-Language:
              schema: { type: string }
            Vary:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/destinations/{slug}:
    get:
      tags: [destinations]
      operationId: getDestination
      summary: Một điểm đến
      description: |
        `slug` phụ thuộc locale, giống mọi slug khác. `404` gộp ba tình huống:
        không tồn tại, chưa dịch cho locale này, hoặc miền chứa nó đã bị xoá mềm.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Điểm đến
          headers:
            Content-Language:
              schema: { type: string }
            Vary:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/themes:
    get:
      tags: [themes]
      operationId: listThemes
      summary: Danh sách chủ đề kèm số sản phẩm
      description: |
        Chủ đề là phân loại **ngang**: một tour trekking miền Bắc và một tour
        trekking miền Trung cùng chủ đề nhưng khác mọi thứ khác.

        `productCount` đếm trong phạm vi `(market, locale)`. Chủ đề chưa có sản
        phẩm nào vẫn trả về với số 0 — nó vẫn là một lựa chọn hợp lệ của bộ lọc.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Danh sách chủ đề
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Theme'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/products/{slug}/itinerary:
    get:
      tags: [products]
      operationId: getItinerary
      summary: Lịch trình từng ngày
      description: |
        **Trả `404` với `COMBO` và `DAY_TOUR`** — hai loại đó không có lịch trình
        theo ngày (`docs/13` mục 9.1). Đây là 404 nói "tài nguyên này không tồn
        tại với loại sản phẩm này", không phải "sản phẩm không tồn tại".

        Ngày bay hoặc ngày trên tàu thì `destination` bị bỏ khỏi JSON.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lịch trình, sắp theo số ngày tăng dần
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItineraryDay'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/products/{slug}/hotels:
    get:
      tags: [products]
      operationId: getHotelStays
      summary: Các chặng nghỉ khách sạn
      description: |
        **Trả `404` với `CRUISE`** — du thuyền ngủ trên tàu, và tab tương ứng
        đổi thành Tàu và cabin (`docs/05` mục 2).

        `name` của khách sạn **không dịch**: tên riêng giữ nguyên ở mọi ngôn ngữ
        (`docs/24` mục 5). Chỉ `description` mới phụ thuộc locale.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách chặng nghỉ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HotelStay'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/products/{slug}/departures:
    get:
      tags: [products]
      operationId: listDepartures
      summary: Ngày khởi hành còn bán
      description: |
        **Không bao giờ được cache** (`docs/13` mục 8). Chỗ còn thay đổi từng
        phút; hiện số chỗ cũ là dẫn khách vào một giao dịch sẽ thất bại ở bước cuối.

        `status` là **giá trị tính ra**, không phải cột trong cơ sở dữ liệu:
        `GUARANTEED` suy từ số khách đã đặt so với ngưỡng đảm bảo khởi hành
        (`docs/14` mục 5). `seatsAvailable` đã **trừ chỗ đang giữ**.

        `CRUISE` trả **phẳng**, mỗi hạng cabin một dòng; gộp theo ngày là việc
        của frontend (`docs/13` mục 9.1).
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ngày khởi hành, sắp theo ngày tăng dần
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Departure'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/posts:
    get:
      tags: [posts]
      operationId: listPosts
      summary: Danh sách bài viết
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: tag
          in: query
          required: false
          description: Slug thẻ **trong locale đang xem**, lặp lại được. Nhiều giá trị nghĩa là **HOẶC**.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: page
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 60, default: 12 }
      responses:
        '200':
          description: Một trang bài viết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/posts/{slug}:
    get:
      tags: [posts]
      operationId: getPost
      summary: Một bài viết
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bài viết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/lectures:
    get:
      tags: [lectures]
      operationId: listLectures
      summary: Buổi thuyết trình sắp diễn ra
      description: |
        **Chỉ buổi chưa diễn ra**, lọc ở truy vấn chứ không ở tầng hiển thị
        (`docs/13` mục 9.1). Lọc ở frontend nghĩa là buổi đã qua vẫn đi qua dây,
        vẫn nằm trong cache, và sẽ có ngày hiện ra.

        Buổi thuyết trình thuộc **đúng một thị trường**: buổi ở Odense phục vụ
        khách Đan, buổi ở Hà Nội phục vụ khách Việt.

        `seatsAvailable` là giá trị tính ra, không có cờ "đã đầy" trong cơ sở dữ
        liệu (`docs/14` mục 5.2).
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Danh sách buổi thuyết trình, sắp theo ngày tăng dần
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lecture'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/session:
    post:
      tags: [admin]
      operationId: dangNhap
      summary: Đăng nhập
      description: |
        Trả về cookie phiên `HttpOnly` + `SameSite=Lax` (`docs/13` mục 10).

        **Không trả token trong thân phản hồi.** Token nằm trong `localStorage`
        đọc được bằng mã chèn vào trang; cookie `HttpOnly` thì không
        (`docs/22` mục 9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Đăng nhập thành công, cookie phiên đã đặt
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    delete:
      tags: [admin]
      operationId: dangXuat
      summary: Đăng xuất
      responses:
        '204':
          description: Phiên đã huỷ

  /api/v1/admin/me:
    get:
      tags: [admin]
      operationId: hoSoNhanVien
      summary: Người đang đăng nhập và vai trò của họ
      responses:
        '200':
          description: Hồ sơ nhân viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfile'
        '401':
          $ref: '#/components/responses/Error'

  /api/v1/admin/products/{id}/translations:
    get:
      tags: [admin]
      operationId: danhSachBanDich
      summary: Mọi bản dịch của một sản phẩm
      description: |
        Trả **tất cả** locale, kể cả bản chưa xuất bản — màn hình dịch song song
        cần bản `da` và bản `vi` cạnh nhau (`docs/22` mục 4.2).
      parameters:
        - $ref: '#/components/parameters/AdminId'
      responses:
        '200':
          description: Danh sách bản dịch, ngôn ngữ nguồn trước
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProductTranslation'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/products/{id}/translations/{locale}:
    put:
      tags: [admin]
      operationId: luuBanDich
      summary: Tạo hoặc sửa một bản dịch
      description: |
        Quyền phụ thuộc **locale đang sửa**, không chỉ phụ thuộc vai trò
        (`docs/22` mục 2.1):

        | Vai trò | Bản `da` (nguồn) | Bản `vi` |
        |---|---|---|
        | `EDITOR` | ghi | **403** |
        | `TRANSLATOR` | **403** | ghi |
        | `ADMIN` | ghi | ghi |

        Người dịch sửa bản nguồn là làm hai bản lệch nhau mà không ai biết bản
        nào đúng — và `da` là ngôn ngữ nguồn (ADR-004).
      parameters:
        - $ref: '#/components/parameters/AdminId'
        - name: locale
          in: path
          required: true
          schema:
            type: string
            enum: [da, vi]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductTranslationInput'
      responses:
        '200':
          description: Bản dịch sau khi lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductTranslation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/products:
    get:
      tags: [admin]
      operationId: danhSachSanPhamQuanTri
      summary: Danh sách sản phẩm, nhìn từ trang quản trị
      description: |
        Khác `GET /api/v1/{market}/products` ở bốn điểm (`docs/22` mục 1), và cả
        bốn đều cố ý:

        | | Bề mặt công khai | Ở đây |
        |---|---|---|
        | Market | Trong đường dẫn | **Không có** — nhân viên làm việc xuyên thị trường |
        | Locale | Trong đường dẫn, trả đúng một bản | **Tất cả** bản dịch của một bản ghi |
        | Bản chưa xuất bản | Không bao giờ | Có |
        | Cache | Có | `no-store` |

        Phân trang **phía máy chủ**: danh sách chỉ lớn dần theo thời gian và
        không bao giờ nhỏ lại (`docs/22` mục 7).
      parameters:
        - name: productType
          in: query
          schema: { $ref: '#/components/schemas/ProductType' }
        - name: market
          in: query
          description: |
            Lọc theo thị trường **đã gán**. Chữ hoa — bề mặt quản trị không có
            market trong đường dẫn nên đây dùng thẳng mã trong CSDL.
          schema:
            type: string
            enum: [DK, VN]
        - name: gap
          in: query
          description: Chỉ lấy sản phẩm đang thiếu hoặc đã cũ ở **một** locale bất kỳ.
          schema: { $ref: '#/components/schemas/TranslationGap' }
        - name: q
          in: query
          description: Tìm trong tiêu đề của **mọi** locale, khử dấu.
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, format: int32, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Một trang sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/v1/admin/translations/queue:
    get:
      tags: [admin]
      operationId: hangDoiDich
      summary: Việc dịch đang chờ, sắp theo tác động doanh thu
      description: |
        Bản ghi có bản ngôn ngữ nguồn `PUBLISHED` nhưng bản đích **thiếu** hoặc
        **`OUTDATED`** (`docs/22` mục 4.1).

        `OUTDATED` là **giá trị tính ra, không lưu**:
        `translation(nguồn).lastModifiedAt > translation(đích).translatedAt`.
        Thêm một cột cờ trong CSDL là tạo ra thứ có thể sai — và nó sẽ sai, vào
        đúng lúc ai đó cập nhật bản nguồn bằng một câu SQL.

        Sắp theo `priority` rồi mới tới ngày (`docs/22` mục 4.1.1). Sắp theo ngày
        là để một dòng chữ trong bài blog chen lên trước một tour đang bán.
      parameters:
        - name: entityType
          in: query
          schema: { $ref: '#/components/schemas/TranslationEntityType' }
        - name: limit
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Hàng đợi, ưu tiên cao trước
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TranslationQueueItem'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/v1/admin/translations/coverage:
    get:
      tags: [admin]
      operationId: doPhuDich
      summary: Độ phủ dịch theo loại thực thể
      description: |
        Hai con số cho mỗi dòng: **đã dịch** và **còn hạn** (`docs/22` mục 4.3).

        Tách hai con số vì chúng nói hai chuyện khác nhau: 100% đã dịch nhưng
        60% còn hạn nghĩa là nội dung đang trôi — và đó là dấu hiệu sớm hơn
        nhiều so với việc khách phàn nàn.

        **Trả số đếm, không trả phần trăm.** API không định dạng số cho người
        đọc (`docs/13` mục 5); chia và làm tròn là việc của frontend.
      parameters:
        - name: locale
          in: query
          description: Locale đích. Bỏ trống thì lấy mọi locale khác ngôn ngữ nguồn.
          schema:
            type: string
            enum: [vi]
      responses:
        '200':
          description: Một dòng cho mỗi cặp (loại thực thể, locale)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TranslationCoverageRow'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'


  /api/v1/{market}/pricing/preview:
    post:
      tags: [booking]
      operationId: xemTruocGia
      summary: Tính giá, không lưu gì
      description: |
        **Không có tác dụng phụ nào.** Màn hình đặt tour gọi endpoint này mỗi lần
        khách đổi lựa chọn, nên nó phải gọi lại được vô số lần mà không tạo ra gì
        (`docs/13` mục 9.2). Vì thế nó **không** đòi `Idempotency-Key`.

        Trả **bảng phân rã từng dòng**. Dòng bằng 0 không xuất hiện — thứ tự cộng
        dồn và quy tắc làm tròn ở `docs/14` mục 2 và 3.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingRequest'
      responses:
        '200':
          description: Bảng phân rã giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceBreakdown'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/seat-holds:
    post:
      tags: [booking]
      operationId: giuCho
      summary: Giữ chỗ có hạn
      description: |
        Tạo ngay khi khách chọn xong ngày khởi hành, **không phải ở bước cuối**
        (`docs/23` mục 3.1): khách điền xong bốn bước rồi mới biết hết chỗ là mất
        công vô ích, và đó là lúc họ bực nhất.

        Chỗ khả dụng đã trừ **chỗ đang giữ còn hạn**. Không đủ chỗ →
        `409 DEPARTURE_SOLD_OUT`.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatHoldRequest'
      responses:
        '201':
          description: Đã giữ chỗ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatHold'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/seat-holds/{id}:
    delete:
      tags: [booking]
      operationId: boGiuCho
      summary: Trả chỗ về kho khi khách quay lại bước trước
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Đã trả chỗ về kho
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/bookings:
    post:
      tags: [booking]
      operationId: datTour
      summary: Tạo đơn đặt
      description: |
        Loại sản phẩm có tồn kho thì **bắt buộc** có `seatHoldId` còn hạn; giữ
        chỗ đã hết hạn → `409 SEAT_HOLD_EXPIRED`.

        Đơn **chụp lại** giá và tên sản phẩm tại thời điểm đặt: đổi bảng giá
        không làm đổi đơn cũ (`docs/23` mục 4.1).
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Đã tạo đơn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/bookings/{reference}:
    get:
      tags: [booking]
      operationId: traDon
      summary: Tra đơn bằng mã và email
      description: |
        Không có đăng nhập cho khách ở v1, nên tra đơn cần **mã + email khớp**.
        Giới hạn 10 lượt/giờ mỗi IP — thiếu giới hạn thì đây là kênh dò mã đơn
        (`docs/13` mục 11).
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: reference
          in: path
          required: true
          schema:
            type: string
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Đơn đặt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/products/{slug}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Chi tiết một sản phẩm
      description: |
        `slug` **phụ thuộc locale**: cùng một tour có slug khác nhau ở `da` và
        `vi`, và slug của locale này không mở được ở locale kia.

        Trả về **đúng một** đối tượng con theo `productType` (ADR-005). Nhờ
        `discriminator`, generator sinh ra kiểu tổng — frontend quên xử lý một
        loại là lỗi biên dịch, không phải màn hình trắng.

        `404` gộp ba tình huống có chủ ý: không tồn tại, chưa dịch cho locale
        này, chưa gán vào thị trường này. Phân biệt ra ngoài là rò rỉ thông tin
        về sản phẩm chưa mở bán (`docs/13` mục 5.1).
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          description: Không dấu ở cả hai ngôn ngữ.
          schema:
            type: string
      responses:
        '200':
          description: Sản phẩm
          headers:
            Content-Language:
              schema: { type: string }
            Vary:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

components:

  parameters:

    Market:
      name: market
      in: path
      required: true
      description: |
        Mã thị trường, chữ thường trong đường dẫn. Quyết định khách **mua** gì:
        catalog, bảng giá, tiền tệ, cổng thanh toán, ràng buộc pháp lý.
        Không suy ra từ locale.
      schema:
        type: string
        enum: [dk, vn]

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID do **client sinh một lần cho một lần đặt**, không sinh lại ở mỗi
        lần thử. Gọi lại cùng khoá trong 24 giờ trả về **cùng kết quả cũ**, không
        tạo bản ghi thứ hai (`docs/13` mục 7).

        Chống ba thứ có thật: khách bấm nút hai lần, mạng di động gửi lại yêu cầu
        sau khi máy chủ đã xử lý xong, và khách bấm Back rồi bấm lại.
      schema:
        type: string
        format: uuid

    AdminId:
      name: id
      in: path
      required: true
      description: |
        Định danh nội bộ. Bề mặt quản trị dùng `id`, bề mặt công khai dùng `slug`
        — `docs/13` mục 4.
      schema:
        type: string
        format: uuid

    AcceptLanguage:
      name: Accept-Language
      in: header
      required: true
      description: |
        Locale, quyết định khách **đọc** bằng tiếng gì. Độc lập hoàn toàn với
        market: khách Việt sống ở Đan Mạch mua ở `dk` nhưng đọc `vi`.
      schema:
        type: string
        enum: [da, vi]

  responses:

    Error:
      description: Lỗi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    Region:
      type: object
      required: [slug, name, productCount]
      properties:
        slug:
          type: string
          description: Không dấu ở cả hai ngôn ngữ. Phụ thuộc locale.
          example: nordvietnam
        name:
          type: string
          example: Nordvietnam
        productCount:
          type: integer
          format: int32
          minimum: 0
          description: Đếm từ dữ liệu trong phạm vi (market, locale). Không hardcode.

    Destination:
      type: object
      description: |
        Một điểm đến, đã dịch sang locale đang xem, kèm miền chứa nó.
      required: [slug, name, region, productCount]
      properties:
        slug:
          type: string
          example: hanoi
        name:
          type: string
          example: Hanoi
        summary:
          type: string
          description: Bỏ hẳn khỏi JSON khi chưa có bản mô tả.
        region:
          $ref: '#/components/schemas/Ref'
        productCount:
          type: integer
          format: int32
          minimum: 0
          description: Đếm từ dữ liệu trong phạm vi (market, locale). Không hardcode.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }

    StaffProfile:
      type: object
      required: [id, email, displayName, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: [CONSULTANT, EDITOR, TRANSLATOR, ADMIN]

    TranslationStatus:
      type: string
      description: |
        `OUTDATED` **không có ở đây**: nó là giá trị tính ra từ thời điểm sửa bản
        nguồn so với thời điểm dịch, không ai nhập tay được (`docs/11` mục 6).
      enum: [DRAFT, TRANSLATED, PUBLISHED]

    AdminProductTranslationInput:
      type: object
      required: [slug, title, shortDescription, longDescription, whyChooseThis, heroImageAlt, status]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Không dấu ở cả hai ngôn ngữ — `docs/02` mục 5.1.
        title: { type: string, minLength: 1, maxLength: 200 }
        shortDescription: { type: string, minLength: 1 }
        longDescription:
          type: array
          items: { type: string }
          minItems: 2
        whyChooseThis:
          type: array
          items: { type: string }
          minItems: 3
          maxItems: 7
        heroImageAlt:
          type: string
          minLength: 1
          maxLength: 300
          description: Nội dung phải dịch, không phải siêu dữ liệu kỹ thuật — `docs/24` mục 6.
        status: { $ref: '#/components/schemas/TranslationStatus' }

    AdminProductTranslation:
      type: object
      required: [locale, slug, title, shortDescription, longDescription, whyChooseThis, heroImageAlt, status, isSource, lastModifiedAt]
      properties:
        locale: { type: string }
        slug: { type: string }
        title: { type: string }
        shortDescription: { type: string }
        longDescription:
          type: array
          items: { type: string }
        whyChooseThis:
          type: array
          items: { type: string }
        heroImageAlt: { type: string }
        status: { $ref: '#/components/schemas/TranslationStatus' }
        isSource:
          type: boolean
          description: Bản này có phải ngôn ngữ nguồn không — ADR-004.
        outdated:
          type: boolean
          description: |
            Tính ra, không lưu: bản nguồn sửa sau lần dịch gần nhất. Bỏ khỏi JSON
            với chính bản nguồn.
        lastModifiedAt: { type: string, format: date-time }
        lastModifiedBy: { type: string, format: uuid }

    TranslationGap:
      type: string
      enum: [MISSING, OUTDATED]
      description: |
        `MISSING` chưa có bản dịch nào. `OUTDATED` có rồi nhưng bản nguồn đã sửa
        sau đó. Cả hai đều **tính ra**, không cột nào trong CSDL lưu chúng.

    TranslationEntityType:
      type: string
      enum: [PRODUCT, POST]
      description: |
        Chỉ hai loại, và **đây là giới hạn của lược đồ chứ không phải của thiết
        kế**: `docs/22` mục 4.1 muốn cả điểm đến, nhưng
        `destination_translation` và `lecture_translation` không có cột `status`
        lẫn `translated_at`, nên với chúng thì "bản nguồn đã xuất bản chưa" và
        "dịch từ lúc nào" đều không trả lời được.

        Thêm hai cột đó là định nghĩa một vòng đời xuất bản cho điểm đến — thứ
        chưa tài liệu nào mô tả, và nó đụng thẳng vào chính sách không-fallback
        (`docs/02`). Vì thế: chờ quyết định, không tự thêm cột.

    AdminTranslationState:
      type: object
      required: [locale, status, isSource, outdated]
      properties:
        locale: { type: string, example: vi }
        status: { $ref: '#/components/schemas/TranslationStatus' }
        isSource:
          type: boolean
          description: Ngôn ngữ nguồn của hệ thống — ADR-004, hiện là `da`.
        outdated:
          type: boolean
          description: Với bản nguồn luôn `false` — nó không dịch từ đâu cả.

    AdminProductMarketState:
      type: object
      required: [market, published]
      properties:
        market:
          type: string
          enum: [DK, VN]
        published:
          type: boolean
          description: |
            Công tắc "bắt đầu bán được" (`docs/01` mục 4.4). Dịch xong mà chưa
            bật thì sản phẩm vẫn **không tồn tại** với khách.

    AdminProductSummary:
      type: object
      required: [id, productType, sourceTitle, sourceStatus, markets, translations]
      properties:
        id: { type: string, format: uuid }
        productType: { $ref: '#/components/schemas/ProductType' }
        sourceTitle:
          type: string
          description: |
            Tiêu đề bản ngôn ngữ nguồn. Luôn có: CSDL từ chối một sản phẩm không
            có bản dịch nguồn (`ct_product_source_translation`).
        sourceStatus: { $ref: '#/components/schemas/TranslationStatus' }
        markets:
          type: array
          items: { $ref: '#/components/schemas/AdminProductMarketState' }
          description: Rỗng nghĩa là **chưa gán thị trường nào**.
        translations:
          type: array
          items: { $ref: '#/components/schemas/AdminTranslationState' }
          description: |
            Chỉ những bản **đang tồn tại**. Locale vắng mặt ở đây là locale chưa
            dịch — frontend đối chiếu với danh sách locale đang bật.
        lastModifiedAt: { type: string, format: date-time }

    AdminProductPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminProductSummary' }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    TranslationQueueItem:
      type: object
      required: [entityType, id, locale, gap, priority, sourceTitle, sourceLastModifiedAt]
      properties:
        entityType: { $ref: '#/components/schemas/TranslationEntityType' }
        id: { type: string, format: uuid }
        locale:
          type: string
          description: Locale **đích** — thứ đang thiếu, không phải thứ đang có.
          example: vi
        gap: { $ref: '#/components/schemas/TranslationGap' }
        priority:
          type: integer
          format: int32
          minimum: 1
          maximum: 4
          description: |
            Bậc ưu tiên của `docs/22` mục 4.1.1, thấp là gấp:

            | | |
            |---|---|
            | 1 | Sản phẩm đã gán thị trường và **đang bán** — chưa dịch là mất doanh thu ngay |
            | 2 | Sản phẩm đã xuất bản bản nguồn, chưa gán thị trường |
            | 3 | Dành cho điểm đến — chưa dùng, xem `TranslationEntityType` |
            | 4 | Bài viết, sự kiện |
        sourceTitle: { type: string }
        sourceLastModifiedAt:
          type: string
          format: date-time
          description: Với `OUTDATED`, đây là **lý do** nó quay lại hàng đợi.
        translatedAt:
          type: string
          format: date-time
          description: Bỏ hẳn khỏi JSON khi chưa dịch lần nào.

    TranslationCoverageRow:
      type: object
      required: [entityType, locale, total, translated, upToDate]
      properties:
        entityType: { $ref: '#/components/schemas/TranslationEntityType' }
        locale: { type: string, example: vi }
        total:
          type: integer
          format: int32
          minimum: 0
          description: |
            Mẫu số: số bản ghi có bản nguồn ở trạng thái `PUBLISHED`. Bản nguồn
            còn là nháp thì chưa đến lượt dịch, nên không tính vào mẫu số.
        translated:
          type: integer
          format: int32
          minimum: 0
        upToDate:
          type: integer
          format: int32
          minimum: 0
          description: Đã dịch **và** không `OUTDATED`. Luôn `<= translated`.


    PaxCount:
      type: object
      required: [paxTypeCode, count]
      properties:
        paxTypeCode:
          type: string
          example: ADULT
        count:
          type: integer
          format: int32
          minimum: 0

    PricingRequest:
      type: object
      required: [departureId, pax]
      properties:
        departureId:
          type: string
          format: uuid
        pax:
          type: array
          items: { $ref: '#/components/schemas/PaxCount' }
          minItems: 1
        singleTravellers:
          type: integer
          format: int32
          minimum: 0
          default: 0
          description: Số khách ở một mình — mỗi người sinh một phần phụ thu phòng đơn.
        departureOriginId:
          type: string
          format: uuid
          description: Chỉ thị trường có nhiều điểm khởi hành.

    PriceLine:
      type: object
      required: [kind, labelKey, amount]
      properties:
        kind:
          type: string
          enum: [BASE, SINGLE_SUPPLEMENT, CABIN_UPGRADE, DEPARTURE_ORIGIN,
                 INSURANCE, PRE_TOUR_HOTEL, EARLY_BIRD_DISCOUNT, PROCESSING_FEE]
        labelKey:
          type: string
          description: |
            **Khoá chuỗi, không phải câu tiếng người.** Frontend dịch — cùng một
            đơn in ra được ở cả hai ngôn ngữ (`docs/13` mục 5).
        quantity:
          type: string
          description: Số lượng dạng chuỗi, cùng lý do với tiền.
        unitAmount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]

    PriceBreakdown:
      type: object
      required: [lines, total, deposit, balance]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/PriceLine' }
          description: Dòng bằng 0 **không xuất hiện** — `docs/14` mục 2.2.
        total: { $ref: '#/components/schemas/Money' }
        deposit:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Làm tròn **xuống**; `deposit + balance` luôn bằng `total`.
        balance: { $ref: '#/components/schemas/Money' }

    SeatHoldRequest:
      type: object
      required: [departureId, seats]
      properties:
        departureId: { type: string, format: uuid }
        seats: { type: integer, format: int32, minimum: 1, maximum: 20 }

    SeatHold:
      type: object
      required: [id, departureId, seats, expiresAt]
      properties:
        id: { type: string, format: uuid }
        departureId: { type: string, format: uuid }
        seats: { type: integer, format: int32 }
        expiresAt:
          type: string
          format: date-time
          description: |
            Frontend hiện bằng **chữ** — "Chúng tôi giữ chỗ cho bạn tới 14:32" —
            không dùng đồng hồ đếm ngược nhấp nháy (`docs/23` mục 3.2).

    PassengerInput:
      type: object
      required: [paxTypeCode, fullName]
      properties:
        paxTypeCode: { type: string }
        fullName: { type: string, minLength: 1, maxLength: 160 }
        dateOfBirth: { type: string, format: date }
        nationality: { type: string, minLength: 2, maxLength: 2 }

    BookingRequest:
      type: object
      required: [departureId, pax, passengers, contactEmail, contactPhone]
      properties:
        departureId: { type: string, format: uuid }
        seatHoldId:
          type: string
          format: uuid
          description: Bắt buộc với loại sản phẩm có tồn kho.
        pax:
          type: array
          items: { $ref: '#/components/schemas/PaxCount' }
          minItems: 1
        singleTravellers: { type: integer, format: int32, minimum: 0, default: 0 }
        departureOriginId: { type: string, format: uuid }
        passengers:
          type: array
          items: { $ref: '#/components/schemas/PassengerInput' }
          minItems: 1
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, minLength: 5, maxLength: 32 }

    BookingStatus:
      type: string
      description: Máy trạng thái ở `docs/23` mục 4. Không có bước lùi.
      enum: [DRAFT, PENDING_PAYMENT, PENDING_CONFIRMATION, CONFIRMED,
             COMPLETED, CANCELLED, REFUNDED, EXPIRED]

    Booking:
      type: object
      required: [reference, status, productTitle, total, deposit, balance, lines]
      properties:
        reference:
          type: string
          description: Mã tra cứu khách đọc qua điện thoại cho tổng đài.
        status: { $ref: '#/components/schemas/BookingStatus' }
        productTitle:
          type: string
          description: |
            **Chụp lại lúc đặt.** Sửa tên tour sau này không làm đổi đơn cũ
            (`docs/23` mục 4.1).
        departDate: { type: string, format: date }
        total: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PriceLine' }

    Theme:
      type: object
      required: [slug, name, productCount]
      properties:
        slug: { type: string, example: trekking }
        name: { type: string, example: Trekking }
        productCount: { type: integer, format: int32, minimum: 0 }

    ItineraryDay:
      type: object
      required: [dayNumber, title, description]
      properties:
        dayNumber: { type: integer, format: int32, minimum: 1 }
        title: { type: string }
        description: { type: string }
        destination:
          allOf: [{ $ref: '#/components/schemas/Ref' }]
          description: Nơi ngủ đêm. Bỏ khỏi JSON với ngày bay hoặc ngày trên tàu.
        hotelName:
          type: string
          description: Tên riêng, **không dịch**.

    HotelStay:
      type: object
      required: [name, nights, destination]
      properties:
        name:
          type: string
          description: Tên riêng của khách sạn, **không dịch** — `docs/24` mục 5.
        stars: { type: integer, format: int32, minimum: 1, maximum: 5 }
        nights: { type: integer, format: int32, minimum: 1 }
        destination: { $ref: '#/components/schemas/Ref' }
        description:
          type: string
          description: Phụ thuộc locale. Bỏ khỏi JSON khi chưa dịch.
        image: { type: string }

    DepartureStatus:
      type: string
      description: |
        Giá trị **tính ra**, không phải cột trong cơ sở dữ liệu. Thứ tự xét ở
        `docs/14` mục 5; `GUARANTEED` xét **trước** `FEW_SEATS`.
      enum: [OPEN, FEW_SEATS, GUARANTEED, SOLD_OUT, PENDING]

    Departure:
      type: object
      required: [id, departDate, returnDate, days, status, seatsAvailable]
      properties:
        id: { type: string, format: uuid }
        departDate: { type: string, format: date }
        returnDate: { type: string, format: date }
        days: { type: integer, format: int32 }
        status: { $ref: '#/components/schemas/DepartureStatus' }
        seatsAvailable:
          type: integer
          format: int32
          minimum: 0
          description: Đã trừ chỗ đang giữ — `docs/14` mục 6.1.
        priceFrom:
          allOf: [{ $ref: '#/components/schemas/Money' }]
        cabinCategory:
          type: string
          description: Chỉ `CRUISE`.
        departureCity:
          type: string
          description: Chỉ những thị trường có nhiều điểm khởi hành.

    PostSummary:
      type: object
      required: [slug, title, excerpt, tags]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        heroImage: { type: string }
        publishedAt: { type: string, format: date-time }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Ref' }

    PostPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PostSummary' }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int32 }

    PostDetail:
      type: object
      required: [slug, title, excerpt, body, tags]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        body:
          type: array
          items: { type: string }
          description: Từng đoạn văn một, không phải một khối HTML.
        heroImage: { type: string }
        publishedAt: { type: string, format: date-time }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Ref' }

    Lecture:
      type: object
      required: [id, eventDate, city, title, description, seats, seatsAvailable]
      properties:
        id: { type: string, format: uuid }
        eventDate: { type: string, format: date }
        startTime:
          type: string
          description: Giờ địa phương, dạng `HH:MM`.
        city: { type: string }
        venue: { type: string }
        title: { type: string }
        description: { type: string }
        seats: { type: integer, format: int32 }
        seatsAvailable:
          type: integer
          format: int32
          minimum: 0
          description: Giá trị tính ra — không có cờ "đã đầy" trong cơ sở dữ liệu.

    ProductType:
      type: string
      description: |
        Sáu loại sản phẩm, mỗi loại có bảng con riêng và ràng buộc nghiệp vụ
        riêng — `docs/04`. `PRIVATE_TOUR` **không đặt trực tiếp được**: CTA là
        "Yêu cầu báo giá".
      enum:
        - GROUP_TOUR
        - INDIVIDUAL_PACKAGE
        - PRIVATE_TOUR
        - CRUISE
        - COMBO
        - DAY_TOUR

    ProductSort:
      type: string
      description: Trường và chiều sắp xếp, phân tách bằng dấu phẩy — `docs/13` mục 6.
      enum:
        - 'title,asc'
        - 'title,desc'
        - 'priceFrom,asc'
        - 'priceFrom,desc'
        - 'durationDays,asc'
        - 'durationDays,desc'
      default: 'title,asc'

    Ref:
      type: object
      description: Tham chiếu tới một thực thể khác — chỉ slug và tên, đã dịch sang locale đang xem.
      required: [slug, name]
      properties:
        slug:
          type: string
          example: nordvietnam
        name:
          type: string
          example: Nordvietnam

    ProductSummary:
      type: object
      description: |
        Bản rút gọn dùng cho listing. **Không** chứa hành trình, khách sạn hay
        ngày khởi hành — những thứ đó chỉ có ở trang chi tiết, và ngày khởi hành
        thì không bao giờ được cache (`docs/13` mục 8).
      required: [slug, title, productType, shortDescription, heroImage, heroImageAlt, region, destination, isNew, reviewCount]
      properties:
        slug: { type: string, example: vietnam-fra-nord-til-syd }
        title: { type: string, example: Vietnam fra nord til syd }
        productType: { $ref: '#/components/schemas/ProductType' }
        shortDescription: { type: string }
        heroImage: { type: string }
        heroImageAlt:
          type: string
          description: Bắt buộc, và **phụ thuộc locale** — chữ alt cũng là nội dung phải dịch.
        durationDays:
          type: integer
          format: int32
          description: Bỏ hẳn khỏi JSON với `DAY_TOUR` — loại đó đo bằng giờ.
        region: { $ref: '#/components/schemas/Ref' }
        destination: { $ref: '#/components/schemas/Ref' }
        priceFrom:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            Giá **thấp nhất** của thị trường này, không phải giá đã quy đổi tỷ
            giá — mỗi thị trường có giá riêng do người nhập (`CLAUDE.md` điều 4).
            Chưa có bảng giá thì **bỏ hẳn** trường này, frontend hiện "Liên hệ".
        isNew: { type: boolean }
        rating:
          type: number
          format: double
          minimum: 1
          maximum: 5
        reviewCount: { type: integer, format: int32, minimum: 0 }

    ProductPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1 }
        totalItems:
          type: integer
          format: int64
          minimum: 0
          description: |
            Đếm trong phạm vi `(market, locale)` sau khi đã áp bộ lọc. Đây là con
            số frontend phải hiển thị — "Xem tất cả 92 tour" không được hardcode.
        totalPages: { type: integer, format: int32, minimum: 0 }

    ProductDetailBase:
      type: object
      required: [slug, title, productType, shortDescription, longDescription, whyChooseThis, heroImage, heroImageAlt, region, destination, isNew, reviewCount]
      properties:
        slug: { type: string }
        title: { type: string }
        productType:
          # Cố tình là `string` trần chứ không $ref tới enum ProductType: đây là
          # trường phân loại (discriminator), và openapi-generator sinh interface
          # cha với kiểu String trong khi sinh lớp con với kiểu enum — hai chữ ký
          # không tương thích và Java không biên dịch được. Kiểu cụ thể đã nằm ở
          # chính lớp con rồi, nên không mất gì.
          type: string
          example: GROUP_TOUR
        shortDescription: { type: string }
        longDescription:
          type: array
          items: { type: string }
          description: Từng đoạn văn một, không phải một khối HTML.
        whyChooseThis:
          type: array
          items: { type: string }
          minItems: 3
          maxItems: 7
        heroImage: { type: string }
        heroImageAlt: { type: string }
        mapImage: { type: string }
        durationDays: { type: integer, format: int32 }
        region: { $ref: '#/components/schemas/Ref' }
        destination: { $ref: '#/components/schemas/Ref' }
        priceFrom:
          allOf: [{ $ref: '#/components/schemas/Money' }]
        isNew: { type: boolean }
        rating: { type: number, format: double }
        reviewCount: { type: integer, format: int32 }

    GroupTourDetail:
      description: Đoàn ghép có trưởng đoàn. `guaranteedThreshold` là số khách tối thiểu để chuyến chắc chắn khởi hành.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [minPax, maxPax, guaranteedThreshold, tourLeaderLanguage, fitnessLevel]
          properties:
            minPax: { type: integer, format: int32 }
            maxPax: { type: integer, format: int32 }
            guaranteedThreshold: { type: integer, format: int32 }
            tourLeaderLanguage:
              type: string
              description: |
                Ngôn ngữ của trưởng đoàn. **Không phải** locale khách đang đọc —
                khách Việt ở Đan Mạch đọc `vi` nhưng đi đoàn có trưởng đoàn nói `da`.
            fitnessLevel: { type: integer, format: int32, minimum: 1, maximum: 4 }

    IndividualPackageDetail:
      description: Gói cá nhân, khách tự chọn ngày trong cửa sổ linh hoạt.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [minPartySize, flexibleDateWindowDays]
          properties:
            minPartySize: { type: integer, format: int32 }
            flexibleDateWindowDays: { type: integer, format: int32 }

    PrivateTourDetail:
      description: |
        Tour riêng — **không đặt trực tiếp được**. Bấm CTA sinh một yêu cầu báo
        giá; giá cuối do tư vấn viên dựng.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [leadTimeDays, quoteValidDays]
          properties:
            leadTimeDays:
              type: integer
              format: int32
              description: Ngày khởi hành sớm hơn số ngày này thì trả `LEAD_TIME_NOT_MET`.
            quoteValidDays: { type: integer, format: int32 }

    CruiseDetail:
      description: Du thuyền. Ngày khởi hành trả **phẳng**, gộp theo ngày là việc của frontend.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [shipName, portCount]
          properties:
            shipName: { type: string }
            portCount: { type: integer, format: int32 }

    ComboDetail:
      description: Bó cố định do nhân viên soạn, chỉ bán trong khoảng ngày hiệu lực.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [nights, validFrom, validTo]
          properties:
            nights: { type: integer, format: int32 }
            validFrom: { type: string, format: date }
            validTo: { type: string, format: date }

    DayTourDetail:
      description: Tour trong ngày. Đo bằng **giờ**, nên `durationDays` không có mặt.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [durationHours, cutoffHours]
          properties:
            durationHours: { type: integer, format: int32 }
            cutoffHours:
              type: integer
              format: int32
              description: Số giờ trước khi khởi hành thì đóng nhận đặt.

    ProductDetail:
      description: |
        Kiểu tổng theo `productType` — ADR-005. Generator sinh ra union
        TypeScript và interface Java, nên **quên xử lý một loại là lỗi biên dịch**.
      oneOf:
        - $ref: '#/components/schemas/GroupTourDetail'
        - $ref: '#/components/schemas/IndividualPackageDetail'
        - $ref: '#/components/schemas/PrivateTourDetail'
        - $ref: '#/components/schemas/CruiseDetail'
        - $ref: '#/components/schemas/ComboDetail'
        - $ref: '#/components/schemas/DayTourDetail'
      discriminator:
        propertyName: productType
        mapping:
          GROUP_TOUR: '#/components/schemas/GroupTourDetail'
          INDIVIDUAL_PACKAGE: '#/components/schemas/IndividualPackageDetail'
          PRIVATE_TOUR: '#/components/schemas/PrivateTourDetail'
          CRUISE: '#/components/schemas/CruiseDetail'
          COMBO: '#/components/schemas/ComboDetail'
          DAY_TOUR: '#/components/schemas/DayTourDetail'

    Money:
      type: object
      description: |
        `amount` là **chuỗi**, không phải số JSON — số dấu phẩy động của
        JavaScript làm hỏng tiền. API không định dạng: không có "24.990 kr."
        ở bất kỳ đâu trong phản hồi.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?\d+(\.\d+)?$'
          example: '24990.00'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: DKK

    ErrorResponse:
      type: object
      description: Mã lỗi kèm tham số. Frontend dịch — backend không trả câu tiếng người.
      required: [code]
      properties:
        code:
          type: string
          example: NOT_FOUND
        params:
          type: object
          additionalProperties: true
        traceId:
          type: string
