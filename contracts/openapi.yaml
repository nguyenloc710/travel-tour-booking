openapi: 3.0.3

# Nguồn sự thật của hợp đồng API (ADR-002). Viết tay, review như review code.
#
# Thứ tự bắt buộc khi đổi — CLAUDE.md mục "Đổi hợp đồng API":
#   1. sửa file này          ← pull request riêng, có người duyệt
#   2. pnpm contracts:generate
#   3. sửa controller cho khớp interface mới
#   4. sửa frontend
#
# Quy ước ở docs/13-hop-dong-api.md. Ba điều hay sai nhất:
#   · market ở ĐƯỜNG DẪN, locale ở HEADER Accept-Language — không gộp
#   · tiền là đối tượng, `amount` là CHUỖI, API không định dạng
#   · lỗi trả MÃ kèm tham số, không trả câu tiếng người
#
# Phiên bản 0.1: chỉ một endpoint đọc, đủ để chứng minh spec-first sinh được cả
# interface Java lẫn TS client và cả hai bên biên dịch sạch (cổng G2).
#
# Phiên bản 0.2: lõi danh mục (G3) — listing sản phẩm và trang chi tiết.
# Phiên bản 0.3: điểm đến, và bộ lọc sản phẩm theo điểm đến.
# Phiên bản 0.4: chủ đề, lịch trình, khách sạn, ngày khởi hành, bài viết,
#                buổi thuyết trình — đủ danh mục đọc của docs/13 mục 9.1.
# Phiên bản 0.6: đường GHI của khách — tính giá xem trước, giữ chỗ, đặt tour,
#                tra đơn. Ba endpoint đầu đòi Idempotency-Key (docs/13 mục 7).
# Phiên bản 0.5: bề mặt QUẢN TRỊ — phiên đăng nhập và sửa bản dịch sản phẩm.
#                Khác bề mặt công khai ở bốn điểm (docs/13 mục 2): không có
#                market trong đường dẫn, trả MỌI bản dịch chứ không một, thấy cả
#                nội dung chưa xuất bản, và không bao giờ cache.
# Phiên bản 0.11: VẬN HÀNH ĐƠN — danh sách đơn (docs/22 M6) và chi tiết đơn
#                 kèm toàn bộ nhật ký booking_event (M7). Hai endpoint chỉ ĐỌC:
#                 đổi trạng thái đơn là đợt sau, và ma trận quyền docs/22 mục
#                 2.1 tách hẳn "xem đơn" khỏi "đổi trạng thái đơn".
# Phiên bản 0.12: đường GHI của M7 — nhân viên đổi trạng thái đơn. Máy trạng
#                 thái ở docs/23 mục 4; mọi lần đổi ghi một booking_event.
# Phiên bản 0.14: NỘI DUNG KHÁC (docs/22 M13) và NGƯỜI DÙNG (M14) — điểm đến,
#                 bài viết và buổi thuyết trình sửa được từ giao diện, và ADMIN
#                 gán được vai trò. Trước đợt này ba nhóm nội dung đó chỉ có
#                 đường ĐỌC, còn vai trò thì phải sửa bằng SQL tay.
# Phiên bản 0.13: BÁO GIÁ — khách gửi yêu cầu báo giá cho PRIVATE_TOUR, nhân
#                 viên dựng bảng giá rồi gửi (docs/22 M8). Vòng đời và bảy quy
#                 tắc ở docs/14 mục 7. Đây là thứ làm cho CTA "Yêu cầu báo giá"
#                 của docs/05 mục 6 dẫn tới một chỗ có thật.

info:
  title: Travel Tour Booking API
  version: 0.15.0
  description: |
    API cho website bán tour du lịch Việt Nam, hai thị trường (DK, VN),
    hai ngôn ngữ (da, vi).

servers:
  - url: /
    description: Cùng gốc với ứng dụng

tags:
  - name: regions
    description: Miền — cấp phân loại địa lý trên cùng
  - name: products
    description: Sản phẩm — sáu loại, mỗi loại có bảng con riêng (ADR-005)
  - name: destinations
    description: Điểm đến — cấp phân loại dưới miền
  - name: themes
    description: Chủ đề — phân loại ngang, cắt qua miền và loại sản phẩm
  - name: posts
    description: Bài viết
  - name: lectures
    description: Buổi thuyết trình
  - name: booking
    description: |
      Giữ chỗ, tính giá và đặt tour. Mọi endpoint ở đây **không bao giờ được
      cache** và endpoint tạo ra hệ quả tính tiền đều đòi `Idempotency-Key`.
  - name: admin
    description: |
      Bề mặt quản trị. Yêu cầu phiên đăng nhập; quyền theo bốn vai trò của
      `docs/22` mục 2.1.

paths:
  /api/v1/{market}/regions:
    get:
      tags: [regions]
      operationId: listRegions
      summary: Danh sách miền kèm số sản phẩm
      description: |
        Số sản phẩm đếm theo **sản phẩm**, không cộng dồn từng điểm đến: một tour
        ghé Hà Nội, Hạ Long và Ninh Bình chỉ tính một lần cho miền Bắc.

        Đếm trong phạm vi `(market, locale)` đang xem. Miền không có sản phẩm nào
        đã xuất bản ở thị trường này vẫn trả về, với `productCount` bằng 0.

        Miền thiếu bản dịch cho locale yêu cầu thì **không xuất hiện** — chính
        sách không-fallback của `docs/02` mục 4.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Danh sách miền
          headers:
            Content-Language:
              schema: { type: string }
              description: Ngôn ngữ thực tế của nội dung trả về
            Vary:
              schema: { type: string }
              description: Luôn chứa Accept-Language
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Danh sách sản phẩm của một thị trường
      description: |
        Chỉ trả sản phẩm **đã xuất bản ở thị trường này** và **đã dịch sang locale
        đang xem**. Sản phẩm thiếu bản dịch biến mất hoàn toàn — không listing,
        không tìm kiếm, không hiện bản `da` thay thế (`docs/02` mục 4).

        `totalItems` đếm trong phạm vi `(market, locale)`, nên **hai locale ra hai
        con số khác nhau**. Đúng như thiết kế: frontend hiển thị đúng số này chứ
        không hardcode.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: region
          in: query
          required: false
          description: Slug miền **trong locale đang xem** — `nordvietnam` với `da`, `mien-bac` với `vi`.
          schema:
            type: string
        - name: destination
          in: query
          required: false
          description: |
            Slug điểm đến **trong locale đang xem**. Lọc theo điểm đến **chính**
            của sản phẩm, không lọc theo mọi điểm đến sản phẩm ghé qua — một
            tour xuyên Việt thuộc về một điểm đến khởi hành, không thuộc về tất cả.
          schema:
            type: string
        - name: theme
          in: query
          required: false
          description: |
            Slug chủ đề **trong locale đang xem**. **Lặp lại được** để lọc nhiều
            chủ đề: `?theme=trekking&theme=du-thuyen-song`. Không dùng dấu phẩy —
            dấu phẩy vỡ khi giá trị có chứa dấu phẩy (`docs/13` mục 6).

            Nhiều giá trị nghĩa là **HOẶC**: sản phẩm mang ít nhất một trong số đó.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: productType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductType'
        - name: q
          in: query
          required: false
          description: |
            Tìm trong tiêu đề, **không phân biệt dấu**: gõ `hoi an` ra `Hội An`,
            gõ `halong` ra `Hạ Long`. Bỏ dấu ở tầng CSDL bằng `f_unaccent`.
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          required: false
          description: |
            Mặc định `title,asc`. `title` sắp theo collation của locale đang xem
            (`da-DK-x-icu` xếp æ ø å **sau** z), sắp ở tầng CSDL chứ không ở Java.
          schema:
            $ref: '#/components/schemas/ProductSort'
        - name: page
          in: query
          required: false
          description: Đánh số từ 0. Phân trang theo offset — `docs/13` mục 6.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 60
            default: 24
      responses:
        '200':
          description: Một trang sản phẩm
          headers:
            Content-Language:
              schema: { type: string }
            Vary:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/destinations:
    get:
      tags: [destinations]
      operationId: listDestinations
      summary: Danh sách điểm đến kèm số sản phẩm
      description: |
        Sắp theo miền rồi tới thứ tự trong miền, để danh sách đọc được như một
        hành trình từ Bắc vào Nam chứ không phải một mớ theo bảng chữ cái.

        `productCount` đếm theo **điểm đến chính** của sản phẩm, trong phạm vi
        `(market, locale)` đang xem. Điểm đến chưa có sản phẩm nào vẫn trả về,
        với số bằng 0 — trang điểm đến vẫn có nội dung riêng để đọc.

        Điểm đến thiếu bản dịch cho locale yêu cầu thì **không xuất hiện**.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: region
          in: query
          required: false
          description: Lọc theo slug miền **của locale đang xem**.
          schema:
            type: string
      responses:
        '200':
          description: Danh sách điểm đến
          headers:
            Content-Language:
              schema: { type: string }
            Vary:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/destinations/{slug}:
    get:
      tags: [destinations]
      operationId: getDestination
      summary: Một điểm đến
      description: |
        `slug` phụ thuộc locale, giống mọi slug khác. `404` gộp ba tình huống:
        không tồn tại, chưa dịch cho locale này, hoặc miền chứa nó đã bị xoá mềm.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Điểm đến
          headers:
            Content-Language:
              schema: { type: string }
            Vary:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/redirects/{type}/{slug}:
    get:
      tags: [products]
      operationId: resolveSlug
      summary: Slug cũ trỏ tới slug nào bây giờ
      description: |
        Đổi slug làm mọi liên kết cũ chết — liên kết trong email đã gửi, trong bài
        viết của người khác, trong dấu trang của khách. Bảng `slug_history` giữ
        slug cũ (`docs/12` mục 6.1); endpoint này là đường đọc của nó.

        **Chỉ trả slug mới khi bản ghi đích thật sự xem được ở
        `(market, locale)` này.** Đây là điểm quan trọng nhất: một chuyển hướng
        tới trang `404` tệ hơn hẳn một trang `404` thẳng — khách bị đưa đi một
        vòng rồi vẫn không thấy gì, và công cụ tìm kiếm ghi nhận một chuỗi
        chuyển hướng dẫn tới ngõ cụt.

        Vì thế nó kiểm đúng những điều kiện mà đường đọc công khai kiểm: đã dịch
        sang locale này, đã gán và đang bán ở thị trường này, chưa xoá mềm. Thiếu
        bất kỳ điều nào thì trả `404`, và frontend hiện trang không tìm thấy.

        Slug hiện tại gửi vào đây cũng trả `404`: nó không phải slug cũ, và
        chuyển hướng một URL về chính nó là một vòng lặp.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: type
          in: path
          required: true
          description: |
            Loại bản ghi. `slug_history` dùng chung cho nhiều loại, và cùng một
            slug cũ có thể tồn tại ở hai loại khác nhau — nên loại là bắt buộc,
            không đoán được.
          schema:
            type: string
            enum: [PRODUCT, DESTINATION]
        - name: slug
          in: path
          required: true
          description: Slug **cũ**, của đúng locale ở `Accept-Language`.
          schema:
            type: string
      responses:
        '200':
          description: Slug hiện tại của bản ghi đó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugRedirect'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/{market}/themes:
    get:
      tags: [themes]
      operationId: listThemes
      summary: Danh sách chủ đề kèm số sản phẩm
      description: |
        Chủ đề là phân loại **ngang**: một tour trekking miền Bắc và một tour
        trekking miền Trung cùng chủ đề nhưng khác mọi thứ khác.

        `productCount` đếm trong phạm vi `(market, locale)`. Chủ đề chưa có sản
        phẩm nào vẫn trả về với số 0 — nó vẫn là một lựa chọn hợp lệ của bộ lọc.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Danh sách chủ đề
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Theme'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/products/{slug}/itinerary:
    get:
      tags: [products]
      operationId: getItinerary
      summary: Lịch trình từng ngày
      description: |
        **Trả `404` với `COMBO` và `DAY_TOUR`** — hai loại đó không có lịch trình
        theo ngày (`docs/13` mục 9.1). Đây là 404 nói "tài nguyên này không tồn
        tại với loại sản phẩm này", không phải "sản phẩm không tồn tại".

        Ngày bay hoặc ngày trên tàu thì `destination` bị bỏ khỏi JSON.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lịch trình, sắp theo số ngày tăng dần
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItineraryDay'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/products/{slug}/hotels:
    get:
      tags: [products]
      operationId: getHotelStays
      summary: Các chặng nghỉ khách sạn
      description: |
        **Trả `404` với `CRUISE`** — du thuyền ngủ trên tàu, và tab tương ứng
        đổi thành Tàu và cabin (`docs/05` mục 2).

        `name` của khách sạn **không dịch**: tên riêng giữ nguyên ở mọi ngôn ngữ
        (`docs/24` mục 5). Chỉ `description` mới phụ thuộc locale.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách chặng nghỉ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HotelStay'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/products/{slug}/departures:
    get:
      tags: [products]
      operationId: listDepartures
      summary: Ngày khởi hành còn bán
      description: |
        **Không bao giờ được cache** (`docs/13` mục 8). Chỗ còn thay đổi từng
        phút; hiện số chỗ cũ là dẫn khách vào một giao dịch sẽ thất bại ở bước cuối.

        `status` là **giá trị tính ra**, không phải cột trong cơ sở dữ liệu:
        `GUARANTEED` suy từ số khách đã đặt so với ngưỡng đảm bảo khởi hành
        (`docs/14` mục 5). `seatsAvailable` đã **trừ chỗ đang giữ**.

        `CRUISE` trả **phẳng**, mỗi hạng cabin một dòng; gộp theo ngày là việc
        của frontend (`docs/13` mục 9.1).
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ngày khởi hành, sắp theo ngày tăng dần
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Departure'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/posts:
    get:
      tags: [posts]
      operationId: listPosts
      summary: Danh sách bài viết
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: tag
          in: query
          required: false
          description: Slug thẻ **trong locale đang xem**, lặp lại được. Nhiều giá trị nghĩa là **HOẶC**.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: page
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 60, default: 12 }
      responses:
        '200':
          description: Một trang bài viết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/posts/{slug}:
    get:
      tags: [posts]
      operationId: getPost
      summary: Một bài viết
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bài viết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/lectures:
    get:
      tags: [lectures]
      operationId: listLectures
      summary: Buổi thuyết trình sắp diễn ra
      description: |
        **Chỉ buổi chưa diễn ra**, lọc ở truy vấn chứ không ở tầng hiển thị
        (`docs/13` mục 9.1). Lọc ở frontend nghĩa là buổi đã qua vẫn đi qua dây,
        vẫn nằm trong cache, và sẽ có ngày hiện ra.

        Buổi thuyết trình thuộc **đúng một thị trường**: buổi ở Odense phục vụ
        khách Đan, buổi ở Hà Nội phục vụ khách Việt.

        `seatsAvailable` là giá trị tính ra, không có cờ "đã đầy" trong cơ sở dữ
        liệu (`docs/14` mục 5.2).
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Danh sách buổi thuyết trình, sắp theo ngày tăng dần
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lecture'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/session:
    post:
      tags: [admin]
      operationId: dangNhap
      summary: Đăng nhập
      description: |
        Trả về cookie phiên `HttpOnly` + `SameSite=Lax` (`docs/13` mục 10).

        **Không trả token trong thân phản hồi.** Token nằm trong `localStorage`
        đọc được bằng mã chèn vào trang; cookie `HttpOnly` thì không
        (`docs/22` mục 9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Đăng nhập thành công, cookie phiên đã đặt
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    delete:
      tags: [admin]
      operationId: dangXuat
      summary: Đăng xuất
      responses:
        '204':
          description: Phiên đã huỷ

  /api/v1/admin/me:
    get:
      tags: [admin]
      operationId: hoSoNhanVien
      summary: Người đang đăng nhập và vai trò của họ
      responses:
        '200':
          description: Hồ sơ nhân viên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfile'
        '401':
          $ref: '#/components/responses/Error'

  /api/v1/admin/products/{id}/translations:
    get:
      tags: [admin]
      operationId: danhSachBanDich
      summary: Mọi bản dịch của một sản phẩm
      description: |
        Trả **tất cả** locale, kể cả bản chưa xuất bản — màn hình dịch song song
        cần bản `da` và bản `vi` cạnh nhau (`docs/22` mục 4.2).
      parameters:
        - $ref: '#/components/parameters/AdminId'
      responses:
        '200':
          description: Danh sách bản dịch, ngôn ngữ nguồn trước
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminProductTranslation'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/products/{id}/translations/{locale}:
    put:
      tags: [admin]
      operationId: luuBanDich
      summary: Tạo hoặc sửa một bản dịch
      description: |
        Quyền phụ thuộc **locale đang sửa**, không chỉ phụ thuộc vai trò
        (`docs/22` mục 2.1):

        | Vai trò | Bản `da` (nguồn) | Bản `vi` |
        |---|---|---|
        | `EDITOR` | ghi | **403** |
        | `TRANSLATOR` | **403** | ghi |
        | `ADMIN` | ghi | ghi |

        Người dịch sửa bản nguồn là làm hai bản lệch nhau mà không ai biết bản
        nào đúng — và `da` là ngôn ngữ nguồn (ADR-004).
      parameters:
        - $ref: '#/components/parameters/AdminId'
        - name: locale
          in: path
          required: true
          schema:
            type: string
            enum: [da, vi]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductTranslationInput'
      responses:
        '200':
          description: Bản dịch sau khi lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductTranslation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/products:
    get:
      tags: [admin]
      operationId: danhSachSanPhamQuanTri
      summary: Danh sách sản phẩm, nhìn từ trang quản trị
      description: |
        Khác `GET /api/v1/{market}/products` ở bốn điểm (`docs/22` mục 1), và cả
        bốn đều cố ý:

        | | Bề mặt công khai | Ở đây |
        |---|---|---|
        | Market | Trong đường dẫn | **Không có** — nhân viên làm việc xuyên thị trường |
        | Locale | Trong đường dẫn, trả đúng một bản | **Tất cả** bản dịch của một bản ghi |
        | Bản chưa xuất bản | Không bao giờ | Có |
        | Cache | Có | `no-store` |

        Phân trang **phía máy chủ**: danh sách chỉ lớn dần theo thời gian và
        không bao giờ nhỏ lại (`docs/22` mục 7).
      parameters:
        - name: productType
          in: query
          schema: { $ref: '#/components/schemas/ProductType' }
        - name: market
          in: query
          description: |
            Lọc theo thị trường **đã gán**. Chữ hoa — bề mặt quản trị không có
            market trong đường dẫn nên đây dùng thẳng mã trong CSDL.
          schema:
            type: string
            enum: [DK, VN]
        - name: gap
          in: query
          description: Chỉ lấy sản phẩm đang thiếu hoặc đã cũ ở **một** locale bất kỳ.
          schema: { $ref: '#/components/schemas/TranslationGap' }
        - name: q
          in: query
          description: Tìm trong tiêu đề của **mọi** locale, khử dấu.
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, format: int32, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Một trang sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

    post:
      tags: [admin]
      operationId: taoSanPham
      summary: Tạo sản phẩm — phần chung, phần riêng của loại, và bản dịch nguồn
      description: |
        **Một lời gọi tạo ba thứ trong một transaction**: dòng `product`, dòng
        bảng con của loại, và bản dịch **ngôn ngữ nguồn**. Không tách được thành
        ba lời gọi, và đó không phải lựa chọn thiết kế:

        - Ràng buộc `ct_product_source_translation` là `DEFERRABLE INITIALLY
          DEFERRED` — một `product` không có bản dịch nguồn không tồn tại được
          qua hết transaction.
        - Cột của bảng con đều `NOT NULL` và không có mặc định — một `GROUP_TOUR`
          không có `min_pax` cũng không tồn tại được.

        Gửi đúng **một** khối riêng của loại, khớp với `productType`. Gửi sai
        khối hoặc gửi hai khối là `400 PRODUCT_TYPE_BLOCK_MISMATCH` — nói rõ
        thiếu khối nào, chứ không phải một lỗi ràng buộc CSDL mà người dùng
        không đọc được.

        Bản dịch nguồn tạo ra ở trạng thái do client đặt, mặc định `DRAFT`. Nó
        **chưa** vào hàng đợi dịch cho tới khi được xuất bản — `docs/22` mục 4.1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductCreate'
      responses:
        '201':
          description: Sản phẩm vừa tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/v1/admin/translations/queue:
    get:
      tags: [admin]
      operationId: hangDoiDich
      summary: Việc dịch đang chờ, sắp theo tác động doanh thu
      description: |
        Bản ghi có bản ngôn ngữ nguồn `PUBLISHED` nhưng bản đích **thiếu** hoặc
        **`OUTDATED`** (`docs/22` mục 4.1).

        `OUTDATED` là **giá trị tính ra, không lưu**:
        `translation(nguồn).lastModifiedAt > translation(đích).translatedAt`.
        Thêm một cột cờ trong CSDL là tạo ra thứ có thể sai — và nó sẽ sai, vào
        đúng lúc ai đó cập nhật bản nguồn bằng một câu SQL.

        Sắp theo `priority` rồi mới tới ngày (`docs/22` mục 4.1.1). Sắp theo ngày
        là để một dòng chữ trong bài blog chen lên trước một tour đang bán.
      parameters:
        - name: entityType
          in: query
          schema: { $ref: '#/components/schemas/TranslationEntityType' }
        - name: limit
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Hàng đợi, ưu tiên cao trước
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TranslationQueueItem'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/v1/admin/translations/coverage:
    get:
      tags: [admin]
      operationId: doPhuDich
      summary: Độ phủ dịch theo loại thực thể
      description: |
        Hai con số cho mỗi dòng: **đã dịch** và **còn hạn** (`docs/22` mục 4.3).

        Tách hai con số vì chúng nói hai chuyện khác nhau: 100% đã dịch nhưng
        60% còn hạn nghĩa là nội dung đang trôi — và đó là dấu hiệu sớm hơn
        nhiều so với việc khách phàn nàn.

        **Trả số đếm, không trả phần trăm.** API không định dạng số cho người
        đọc (`docs/13` mục 5); chia và làm tròn là việc của frontend.
      parameters:
        - name: locale
          in: query
          description: Locale đích. Bỏ trống thì lấy mọi locale khác ngôn ngữ nguồn.
          schema:
            type: string
            enum: [vi]
      responses:
        '200':
          description: Một dòng cho mỗi cặp (loại thực thể, locale)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TranslationCoverageRow'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'


  /api/v1/admin/destinations:
    get:
      tags: [admin]
      operationId: danhSachDiemDenQuanTri
      summary: Điểm đến, để chọn khi tạo sản phẩm
      description: |
        Bề mặt công khai trả `slug` vì URL của khách dùng slug (`docs/13` mục 4).
        Bề mặt quản trị cần **`id`**: đó là thứ `POST /admin/products` nhận, và
        slug thì đổi được còn id thì không.

        Không lọc theo thị trường và không đếm sản phẩm — đây là danh sách để
        chọn trong một ô `select`, không phải trang danh mục.
      responses:
        '200':
          description: Mọi điểm đến chưa xoá, sắp theo miền rồi tới tên
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDestination'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/admin/products/{id}:
    get:
      tags: [admin]
      operationId: chiTietSanPhamQuanTri
      summary: Một sản phẩm, đủ mọi bản dịch và mọi thị trường
      parameters:
        - $ref: '#/components/parameters/AdminId'
      responses:
        '200':
          description: Sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      tags: [admin]
      operationId: suaSanPham
      summary: Sửa phần chung và phần riêng của loại
      description: |
        **Không đổi được `productType`.** Mỗi loại một bảng con, đổi loại là mất
        dữ liệu riêng của loại cũ (`docs/22` mục 7). Cần đổi thì tạo sản phẩm
        mới. Trường đó vì thế không có trong thân yêu cầu — không phải bị bỏ
        qua, mà là **không tồn tại**.

        Trường vắng mặt thì giữ nguyên; trường có mặt thì ghi đè. `null` không
        dùng để xoá — dùng chuỗi rỗng hoặc endpoint riêng.
      parameters:
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductPatch'
      responses:
        '200':
          description: Sản phẩm sau khi sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      tags: [admin]
      operationId: xoaSanPham
      summary: Xoá mềm sản phẩm và cả chùm dữ liệu của nó
      description: |
        **Xoá mềm, không xoá cứng** (`docs/22` mục 7). Xoá nhầm một tour đang bán
        là sự cố không hoàn tác được.

        Xoá mềm **không lan xuống dưới** như `ON DELETE CASCADE`: đặt
        `product.soft_delete = TRUE` không đụng gì tới bản dịch, ngày khởi hành
        hay bậc giá của nó. Vì thế endpoint này xoá mềm **cả chùm trong một
        transaction** — bỏ sót một bảng là để lại dữ liệu mồ côi mà không truy
        vấn nào lọc ra.

        Sản phẩm còn đơn đặt **chưa kết thúc** thì bị từ chối: đó là dữ liệu của
        khách đang chờ đi, không phải nội dung biên tập.
      parameters:
        - $ref: '#/components/parameters/AdminId'
      responses:
        '204':
          description: Đã xoá mềm
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/admin/products/{id}/markets/{market}:
    put:
      tags: [admin]
      operationId: ganThiTruong
      summary: Gán sản phẩm vào một thị trường, và bật hoặc tắt bán
      description: |
        **Chỉ `ADMIN`** (`docs/22` mục 2.1). Đây là công tắc "bắt đầu bán được"
        (`docs/01` mục 4.4): dịch xong mà chưa gán thì sản phẩm vẫn không tồn tại
        với khách. Nó nằm ở tay người chịu trách nhiệm doanh thu, không ở tay
        người viết nội dung.

        Gọi lại với cùng giá trị là **bất biến** — không cần `Idempotency-Key`,
        vì kết quả không phụ thuộc số lần gọi.

        `product_market` cố tình **không có cột kiểm toán** (`docs/11` mục 11.2
        nhóm C): "ai sửa sản phẩm này" phải có đúng một câu trả lời, và câu đó là
        `product.last_modified_by`. Nên thao tác này cũng chạm `product` — nếu
        không thì lần bật công tắc doanh thu là thay đổi duy nhất trong hệ thống
        không ai đứng tên.

        **Bật bán bị từ chối bằng `409 SINGLE_PRICE_MISSING`** nếu sản phẩm có
        lưu trú qua đêm mà còn ngày khởi hành nào chưa có giá phòng đơn
        (`occupancy = SINGLE`). Thiếu dòng ấy thì không có gì hỏng: máy tính giá
        lấy `giá phòng đơn − giá phòng đôi`, không thấy dòng nào thì phụ thu bằng
        0, và khách đi **một mình** đặt được nguyên chuyến ở giá chia đôi phòng.
        Chênh lệch chỉ lộ ra khi kế toán đối soát với khách sạn — sau khi khách
        đã đi. Quy tắc kiểm 23 của `docs/12` mục 9.

        `DAY_TOUR` không bị kiểm: tour trong ngày không có đêm nào để ở phòng.

        Tắt bán thì **không** kiểm. Chặn đường ra là giam một sản phẩm dữ liệu
        sai ở trạng thái đang bán, tức là làm điều ngược hẳn với ý định.
      parameters:
        - $ref: '#/components/parameters/AdminId'
        - name: market
          in: path
          required: true
          schema:
            type: string
            enum: [DK, VN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMarketAssignment'
      responses:
        '200':
          description: Trạng thái sau khi gán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductMarketState'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/admin/products/{id}/price-tiers:
    put:
      tags: [admin]
      operationId: luuBacGia
      summary: Thay toàn bộ bậc giá của một thị trường
      description: |
        Chỉ `PRIVATE_TOUR` (`docs/14` mục 4). Thay **toàn bộ** bậc giá của thị
        trường đó, không sửa từng dòng: bậc giá là một thang liên tục, sửa lẻ một
        bậc là cách tạo ra khoảng hở giữa hai bậc mà không ai thấy.

        Máy chủ kiểm thang **liền mạch**: bậc sắp theo `minPax`, và bậc sau bắt
        đầu ngay sau bậc trước. Khoảng hở nghĩa là có số khách mà hệ thống không
        tính ra giá; chồng lấn thì tệ hơn — hai bậc cùng khớp, và giá phụ thuộc
        thứ tự dòng trong CSDL.

        Bậc cuối **được phép** bỏ trống `maxPax` (không có trần), và chỉ bậc cuối.
        Để trần ở bậc cuối cũng hợp lệ: số khách vượt trần thì trả
        `PARTY_SIZE_OUT_OF_RANGE`.

        Tiền tệ **không nhận từ client** — nó lấy từ cấu hình thị trường. Cho
        client gửi tiền tệ là mở đường nhập giá DKK vào thị trường `VN`.
      parameters:
        - $ref: '#/components/parameters/AdminId'
        - name: market
          in: query
          required: true
          schema:
            type: string
            enum: [DK, VN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AdminPriceTierInput'
              minItems: 1
      responses:
        '200':
          description: Thang giá sau khi lưu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPriceTier'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/products/{id}/departures:
    get:
      tags: [admin]
      operationId: danhSachNgayKhoiHanhQuanTri
      summary: Ngày khởi hành của một sản phẩm, cả hai thị trường
      description: |
        Khác `GET /{market}/products/{slug}/departures` ở hai điểm: không giới hạn
        một thị trường, và **có cả ngày đã đóng bán**. Nhân viên cần thấy cái đã
        đóng để mở lại được.
      parameters:
        - $ref: '#/components/parameters/AdminId'
        - name: market
          in: query
          schema:
            type: string
            enum: [DK, VN]
      responses:
        '200':
          description: Danh sách, sắp theo thị trường rồi tới ngày đi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDeparture'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags: [admin]
      operationId: taoNgayKhoiHanh
      summary: Tạo một ngày khởi hành
      description: |
        `returnDate` **không nhận từ client**: nó là `departDate + days - 1`, và
        ràng buộc `ck_dep_dates` cưỡng chế đúng công thức đó. Nhận cả hai đầu là
        mời gọi hai giá trị mâu thuẫn nhau.
      parameters:
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDepartureCreate'
      responses:
        '201':
          description: Ngày khởi hành vừa tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeparture'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/products/{id}/departures/copy:
    post:
      tags: [admin]
      operationId: nhanBanLichKhoiHanh
      summary: Nhân bản lịch khởi hành sang thị trường kia
      description: |
        Một sản phẩm bán ở cả hai thị trường có **hai bộ** `departure` (ADR-006).
        Nhập tay hai lần là chắc chắn lệch nhau, nên lịch phải nhân bản được.

        **Chỉ nhân bản lịch: ngày đi, số ngày, sức chứa, hạng cabin. KHÔNG nhân
        bản giá.** Giá của mỗi thị trường là số người nhập, không phải kết quả
        tính từ thị trường kia — tour bán cho khách Đan gồm vé bay quốc tế, bán
        cho khách Việt thì không (`CLAUDE.md` điều 4, `docs/22` mục 10). Ngày
        khởi hành mới vì thế **chưa có giá**, và sản phẩm chưa hiện giá ở thị
        trường đích cho tới khi có người nhập.

        Ngày đã tồn tại ở thị trường đích thì **bỏ qua**, không ghi đè: gọi lại
        lần hai không tạo bản sao thứ hai và không xoá giá vừa nhập.
      parameters:
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDepartureCopy'
      responses:
        '200':
          description: Kết quả nhân bản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDepartureCopyResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/departures/{id}:
    patch:
      tags: [admin]
      operationId: suaNgayKhoiHanh
      summary: Sửa hoặc đóng bán một ngày khởi hành
      description: |
        Đóng bán là `baseStatus`, không phải xoá — `docs/22` M4.

        `GUARANTEED` **không nhận được**: nó là giá trị tính ra
        (`seatsBooked >= guaranteedThreshold`, `docs/14` mục 5) và ràng buộc
        `ck_dep_status` cưỡng chế điều đó ở tầng CSDL. `seatsBooked` cũng không
        nhận: nó là hệ quả của đơn đặt, không phải thứ ai nhập tay.

        Không hạ `capacity` xuống dưới số chỗ **đã bán**.
      parameters:
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDeparturePatch'
      responses:
        '200':
          description: Ngày khởi hành sau khi sửa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDeparture'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/admin/departures/{id}/prices:
    put:
      tags: [admin]
      operationId: luuGiaNgayKhoiHanh
      summary: Thay toàn bộ bảng giá của một ngày khởi hành
      description: |
        Ma trận **loại khách × kiểu phòng** (`docs/22` M5). Thay toàn bộ, không
        sửa từng ô: bảng giá thiếu một ô là một tổ hợp khách đặt được mà hệ thống
        không tính ra giá.

        Loại khách nhận bằng `paxTypeCode`, và mã đó tra trong **thị trường của
        chính ngày khởi hành này** — `pax_type` là dữ liệu riêng từng thị trường.

        Tiền tệ **không nhận từ client**: lấy từ cấu hình thị trường. Cùng lý do
        với bậc giá.

        **Sản phẩm có lưu trú qua đêm phải có ít nhất một dòng
        `occupancy = SINGLE`, và dòng ấy phải cao hơn dòng `DOUBLE` cùng loại
        khách.** Thiếu, hoặc bằng, đều trả `409 SINGLE_PRICE_MISSING`: phụ thu
        phòng đơn tính bằng hiệu hai dòng đó, nên cả hai trường hợp cho ra phụ
        thu 0, và khách đi **một mình** đặt được nguyên chuyến ở giá chia đôi
        phòng. Không có gì hỏng, không có lỗi nào ghi ra, và chênh lệch chỉ lộ
        ra khi kế toán đối soát với khách sạn. Quy tắc kiểm 23 của `docs/12`
        mục 9.

        Đây là chỗ chặn **sớm nhất**: quy trình mở bán của `docs/22` mục 5 bật
        bán ở bước 6 rồi mới nhập ngày khởi hành ở bước 7, nên lúc bấm công tắc
        bán thường chưa có ngày nào để kiểm. Màn hình này thì ngược lại — nó là
        chỗ người ta gõ đúng những con số ấy vào.

        `DAY_TOUR` không bị kiểm: tour trong ngày không có đêm nào để ở phòng.
      parameters:
        - $ref: '#/components/parameters/AdminId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AdminDeparturePriceInput'
              minItems: 1
      responses:
        '200':
          description: Bảng giá sau khi lưu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDeparturePrice'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/admin/bookings:
    get:
      tags: [admin]
      operationId: danhSachDon
      summary: Danh sách đơn đặt, nhìn từ trang quản trị
      description: |
        Màn hình M6 của `docs/22`. Đơn về rồi thì phải có chỗ để nhìn — đây là
        chỗ đó.

        **`scope` mặc định là `NEEDS_ACTION`, không phải `ALL`** (`docs/22` mục
        6). Một danh sách vận hành mở ra mặc định "tất cả" là một danh sách
        không dùng được sau sáu tháng: việc cần làm hôm nay chìm giữa đơn đã
        hoàn tất từ mùa trước. `NEEDS_ACTION` là `PENDING_PAYMENT`,
        `PENDING_CONFIRMATION` và `DRAFT` — ba trạng thái mà **nhân viên** còn
        nợ khách một hành động.

        Truyền `status` thì `scope` bị **bỏ qua**: một bộ lọc tường minh luôn
        thắng một mặc định thông minh.

        `from` và `to` lọc theo **ngày tạo đơn**, không phải ngày khởi hành. Đó
        là câu hỏi vận hành hay gặp nhất ("tuần này về bao nhiêu đơn"), và
        `docs/22` M1 đếm đơn quá hạn xác nhận cũng theo trục thời gian đó.

        Phân trang **phía máy chủ** (`docs/22` mục 7): danh sách đơn chỉ lớn dần
        theo thời gian và không bao giờ nhỏ lại.
      parameters:
        - name: scope
          in: query
          schema:
            allOf: [{ $ref: '#/components/schemas/AdminBookingScope' }]
            default: NEEDS_ACTION
        - name: status
          in: query
          description: Lọc đúng một trạng thái. Có nó thì `scope` bị bỏ qua.
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - name: market
          in: query
          description: |
            Chữ hoa — bề mặt quản trị không có market trong đường dẫn, nên đây
            dùng thẳng mã trong CSDL.
          schema:
            type: string
            enum: [DK, VN]
        - name: from
          in: query
          description: Ngày tạo đơn, tính từ (bao gồm). Múi giờ UTC.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Ngày tạo đơn, tính tới (bao gồm). Múi giờ UTC.
          schema: { type: string, format: date }
        - name: q
          in: query
          description: |
            Tìm theo **mã tra cứu** hoặc **email liên hệ**, khớp một phần, không
            phân biệt hoa thường. Khách đọc mã qua điện thoại là thao tác hằng
            ngày của tổng đài.
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, format: int32, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Một trang đơn đặt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/v1/admin/bookings/{reference}:
    get:
      tags: [admin]
      operationId: chiTietDon
      summary: Một đơn — phân rã giá, hành khách, và toàn bộ nhật ký
      description: |
        Màn hình M7 của `docs/22`. Ba khối, và khối thứ ba là lý do màn hình này
        tồn tại:

        1. **Phân rã giá** — đúng những dòng đã **chụp lại lúc đặt**
           (`booking_line`). Không tính lại: đổi bảng giá hôm nay không được làm
           đổi đơn cũ (`docs/40` tiêu chí ra số 5 của G4).
        2. **Hành khách** — kèm hộ chiếu và quốc tịch, thứ cần cho việc làm visa.
        3. **Toàn bộ `booking_event`** — từ trạng thái nào sang trạng thái nào,
           ai làm, lúc nào. **Không phân trang, không cắt bớt**: một nhật ký
           kiểm toán hiện một nửa là một nhật ký không dùng được khi có tranh
           chấp.

        Tra bằng **mã tra cứu** chứ không bằng `id`: đó là thứ khách đọc qua
        điện thoại, và là thứ nhân viên dán vào thanh địa chỉ.

        `booking_event` là bảng **chỉ ghi thêm** (`docs/11` mục 11.2) — không có
        endpoint sửa hay xoá một dòng nhật ký, và sẽ không bao giờ có.
      parameters:
        - name: reference
          in: path
          required: true
          description: Mã tra cứu, ví dụ `VN-2026-8F3K2P`.
          schema: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Đơn kèm phân rã giá, hành khách và nhật ký
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingDetail'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/bookings/{reference}/status:
    post:
      tags: [admin]
      operationId: doiTrangThaiDon
      summary: Nhân viên đổi trạng thái một đơn
      description: |
        Đường **ghi** của M7. Máy trạng thái ở `docs/23` mục 4, và ba quy tắc của
        nó áp nguyên ở đây:

        1. **Mỗi lần đổi ghi một `booking_event`** — không có ngoại lệ, kể cả
           thao tác của nhân viên. Ghi chú kèm theo vào cùng dòng đó.
        2. **Không có bước lùi.** Bước chuyển không nằm trong máy trạng thái trả
           `409 BOOKING_TRANSITION_NOT_ALLOWED` kèm `from` và `to`. Huỷ nhầm thì
           tạo đơn mới, không đưa `CANCELLED` ngược về `CONFIRMED`.
        3. **Rời trạng thái đang chiếm chỗ thì trả chỗ về kho NGAY**
           (`docs/14` mục 6.5), không chờ hoàn tiền xong. Hoàn tiền và trả chỗ là
           hai việc độc lập, và giữ chỗ trống trong lúc chờ ngân hàng là mất
           doanh thu vô ích.

        `toStatus` chỉ nhận **bốn** giá trị là quyết định của nhân viên. Ba
        trạng thái còn lại cố tình **không** đặt tay được:

        | Không cho đặt | Vì sao |
        |---|---|
        | `PENDING_PAYMENT` | Thuộc luồng thanh toán của khách |
        | `PENDING_CONFIRMATION` | Do kết quả thanh toán sinh ra |
        | `EXPIRED` | Do job quét hạn sinh ra, `docs/14` mục 6.4 |

        Nhân viên đặt tay được ba trạng thái đó nghĩa là nhật ký có thể ghi một
        lần thanh toán chưa từng xảy ra — và nhật ký đó là thứ duy nhất trả lời
        được khi khách khiếu nại.

        **Không đòi `Idempotency-Key`.** Khác ba endpoint ghi công khai
        (`docs/13` mục 7): ở đây gọi lại lần hai rơi đúng vào máy trạng thái và
        trả `409` vì bước chuyển thứ hai không còn hợp lệ — bản thân máy trạng
        thái đã là cơ chế chống gọi lại.
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBookingStatusChange'
      responses:
        '200':
          description: Đơn sau khi đổi, kèm nhật ký đã có dòng mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/admin/quotes:
    get:
      tags: [admin]
      operationId: danhSachBaoGia
      summary: Danh sách báo giá, nhìn từ trang quản trị
      description: |
        Màn hình M8 của `docs/22`. Chỉ `PRIVATE_TOUR` — loại khác không đi qua
        luồng báo giá.

        **`status` mặc định là `DRAFT`**, cùng lý do với `scope=NEEDS_ACTION` ở
        danh sách đơn: `DRAFT` là những yêu cầu khách đã gửi mà **chưa ai dựng
        giá**, tức là phần việc đang nợ. Mở mặc định "tất cả" thì yêu cầu về
        sáng nay chìm giữa báo giá đã chốt từ mùa trước.

        Sắp xếp: **cũ nhất trước**. Ngược với danh sách đơn, và có chủ ý — ở đây
        thứ tự là hàng đợi việc, mà việc chờ lâu nhất thì gấp nhất.
      parameters:
        - name: status
          in: query
          description: Để trống lấy `DRAFT`. Truyền `ALL` để lấy mọi trạng thái.
          schema:
            allOf: [{ $ref: '#/components/schemas/AdminQuoteFilter' }]
            default: DRAFT
        - name: market
          in: query
          schema:
            type: string
            enum: [DK, VN]
        - name: q
          in: query
          description: Tìm theo **mã báo giá**, tên hoặc email khách; khớp một phần.
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, format: int32, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Một trang báo giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuotePage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/v1/admin/quotes/{reference}:
    get:
      tags: [admin]
      operationId: chiTietBaoGia
      summary: Một báo giá — yêu cầu của khách và bảng giá đang dựng
      parameters:
        - name: reference
          in: path
          required: true
          description: Mã báo giá, ví dụ `Q-DK-2026-8F3K2P`.
          schema: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Báo giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuoteDetail'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/quotes/{reference}/lines:
    put:
      tags: [admin]
      operationId: dungBangGiaBaoGia
      summary: Tư vấn viên dựng bảng giá của một báo giá
      description: |
        `PUT` chứ không `PATCH`: thân yêu cầu là **toàn bộ** bảng giá, và lưu là
        thay sạch `quote_line` cũ. Sửa một dòng giữa bảng bằng `PATCH` thì phải
        đánh số dòng ổn định, mà bảng giá đang dựng thì thứ tự đổi liên tục.

        `total` **không nhận từ client** — máy chủ cộng từ các dòng. Nhận tổng
        rồi tin là mở đường cho một báo giá mà tổng không khớp bảng, và đó đúng
        là thứ khách sẽ mang ra tranh cãi.

        Chỉ sửa được khi báo giá còn ở `DRAFT` (`docs/14` mục 7): đã gửi cho
        khách rồi thì bảng giá là thứ khách đang cầm, không sửa sau lưng được →
        `409 QUOTE_NOT_ACCEPTABLE`.

        Giá ở đây **được phép khác** bảng giá theo bậc (`docs/14` mục 7 quy tắc
        5) — đó là toàn bộ lý do `PRIVATE_TOUR` tồn tại.
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminQuoteLinesInput'
      responses:
        '200':
          description: Báo giá sau khi dựng bảng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuoteDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/admin/quotes/{reference}/status:
    post:
      tags: [admin]
      operationId: doiTrangThaiBaoGia
      summary: Gửi báo giá, hoặc ghi nhận khách đã trả lời
      description: |
        Máy trạng thái ở `docs/14` mục 7:

        ```
        DRAFT ──► SENT ──► ACCEPTED
                    ├──► REJECTED
                    └──► EXPIRED   (job, không phải người)
        ```

        Ba điều đi kèm, và không cái nào là tuỳ chọn:

        1. **`SENT` đặt `validUntil` = hôm nay + `quoteValidDays` của sản phẩm**
           (quy tắc 2). Ngày này do máy chủ tính, không nhận từ client — hạn của
           một cam kết giá không phải thứ để người gửi tự gõ.
        2. **Không gửi được báo giá chưa có dòng nào** → `409
           QUOTE_NOT_ACCEPTABLE`. Một báo giá rỗng gửi đi là một email làm khách
           mất thời gian.
        3. **Quá `validUntil` thì không `ACCEPTED` được** → `409 QUOTE_EXPIRED`,
           khách phải yêu cầu lại. **Không tự gia hạn** (quy tắc 4).

        `EXPIRED` **không đặt tay được**, cùng lý do với `EXPIRED` của đơn: nó là
        kết luận của đồng hồ, không phải quyết định của người.
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string, maxLength: 20 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminQuoteStatusChange'
      responses:
        '200':
          description: Báo giá sau khi đổi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuoteDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/admin/destinations/{id}:
    get:
      tags: [admin]
      operationId: chiTietDiemDenQuanTri
      summary: Một điểm đến, kèm mọi bản dịch
      parameters: [{ $ref: '#/components/parameters/AdminId' }]
      responses:
        '200':
          description: Điểm đến
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDestinationDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [admin]
      operationId: suaDiemDen
      summary: Sửa phần không phụ thuộc ngôn ngữ của một điểm đến
      description: |
        `code` **không có ở đây**: nó là định danh nội bộ mà dữ liệu mồi, tài
        liệu và câu chuyện của cả đội đang trỏ tới. Đổi mã là đổi thứ người ta
        gọi tên nhau bằng, và không có màn hình nào cho việc đó.
      parameters: [{ $ref: '#/components/parameters/AdminId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminDestinationPatch' }
      responses:
        '200':
          description: Điểm đến sau khi sửa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDestinationDetail' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      operationId: xoaDiemDen
      summary: Xoá mềm một điểm đến
      description: |
        **Xoá mềm** — `soft_delete = TRUE`, không `DELETE` thật (`docs/22` mục 7).

        Còn sản phẩm nào trỏ tới thì từ chối bằng `409 DESTINATION_IN_USE` kèm số
        sản phẩm. Xoá một điểm đến đang được dùng làm cả sản phẩm mất chỗ hiển
        thị mà **không có gì nổ** — nó chỉ lặng lẽ biến mất khỏi listing, vì truy
        vấn sản phẩm `INNER JOIN destination_translation`.
      parameters: [{ $ref: '#/components/parameters/AdminId' }]
      responses:
        '204':
          description: Đã xoá mềm
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/admin/destinations/{id}/translations/{locale}:
    put:
      tags: [admin]
