            schema: { $ref: '#/components/schemas/AdminStaffUserPatch' }
      responses:
        '200':
          description: Người dùng sau khi sửa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStaffUser' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/admin/users/{id}/roles:
    put:
      tags: [admin]
      operationId: datVaiTro
      summary: Thay toàn bộ tập vai trò của một người dùng
      description: |
        `PUT` thay sạch, không `POST` thêm từng cái: vai trò là một **tập**, và
        màn hình cho người ta tick vài ô rồi bấm Lưu. Một endpoint thêm cộng một
        endpoint xoá nghĩa là bỏ tick rồi bấm Lưu sẽ không gỡ được gì.

        Gỡ vai trò `ADMIN` cuối cùng trả `409 LAST_ADMIN`, cùng lý do với việc
        tắt tài khoản.
      parameters: [{ $ref: '#/components/parameters/AdminId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminRoleAssignment' }
      responses:
        '200':
          description: Người dùng sau khi đổi vai trò
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStaffUser' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/{market}/pricing/preview:
    post:
      tags: [booking]
      operationId: xemTruocGia
      summary: Tính giá, không lưu gì
      description: |
        **Không có tác dụng phụ nào.** Màn hình đặt tour gọi endpoint này mỗi lần
        khách đổi lựa chọn, nên nó phải gọi lại được vô số lần mà không tạo ra gì
        (`docs/13` mục 9.2). Vì thế nó **không** đòi `Idempotency-Key`.

        Trả **bảng phân rã từng dòng**. Dòng bằng 0 không xuất hiện — thứ tự cộng
        dồn và quy tắc làm tròn ở `docs/14` mục 2 và 3.

        `singleTravellers > 0` mà ngày khởi hành không có giá `occupancy = SINGLE`
        trả **`409 SINGLE_PRICE_MISSING`**, không trả một bảng giá không có dòng
        phụ thu. Hai tình huống dẫn tới cùng một dữ liệu thiếu — "không bán phòng
        đơn cho chuyến này" và "quên nhập giá" — nên máy chủ **không đoán** giữa
        chúng: đoán sai theo hướng dễ chịu là bán nguyên chuyến ở giá chia đôi
        phòng. Đường bật bán chặn từ đầu (`PUT .../markets/{market}`), nên với
        sản phẩm đang bán thì mã này không nên xuất hiện; nó là lưới thứ hai.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricingRequest'
      responses:
        '200':
          description: Bảng phân rã giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceBreakdown'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/seat-holds:
    post:
      tags: [booking]
      operationId: giuCho
      summary: Giữ chỗ có hạn
      description: |
        Tạo ngay khi khách chọn xong ngày khởi hành, **không phải ở bước cuối**
        (`docs/23` mục 3.1): khách điền xong bốn bước rồi mới biết hết chỗ là mất
        công vô ích, và đó là lúc họ bực nhất.

        Chỗ khả dụng đã trừ **chỗ đang giữ còn hạn**. Không đủ chỗ →
        `409 DEPARTURE_SOLD_OUT`.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatHoldRequest'
      responses:
        '201':
          description: Đã giữ chỗ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatHold'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/seat-holds/{id}:
    delete:
      tags: [booking]
      operationId: boGiuCho
      summary: Trả chỗ về kho khi khách quay lại bước trước
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Đã trả chỗ về kho
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/bookings:
    post:
      tags: [booking]
      operationId: datTour
      summary: Tạo đơn đặt
      description: |
        Loại sản phẩm có tồn kho thì **bắt buộc** có `seatHoldId` còn hạn; giữ
        chỗ đã hết hạn → `409 SEAT_HOLD_EXPIRED`.

        Đơn **chụp lại** giá và tên sản phẩm tại thời điểm đặt: đổi bảng giá
        không làm đổi đơn cũ (`docs/23` mục 4.1).
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Đã tạo đơn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/bookings/{reference}:
    get:
      tags: [booking]
      operationId: traDon
      summary: Tra đơn bằng mã và email
      description: |
        Không có đăng nhập cho khách ở v1, nên tra đơn cần **mã + email khớp**.
        Giới hạn 10 lượt/giờ mỗi IP — thiếu giới hạn thì đây là kênh dò mã đơn
        (`docs/13` mục 11).
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: reference
          in: path
          required: true
          schema:
            type: string
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Đơn đặt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/quote-requests:
    post:
      tags: [booking]
      operationId: guiYeuCauBaoGia
      summary: Khách gửi yêu cầu báo giá cho một tour riêng
      description: |
        Chỉ `PRIVATE_TOUR` (`docs/04`). Loại khác đặt thẳng được nên không đi qua
        đây → `422 PRODUCT_NOT_QUOTABLE`.

        Sinh một `quote` ở trạng thái `DRAFT` — **yêu cầu của khách chính là bản
        nháp báo giá**, không phải một bảng riêng. Tư vấn viên nhận nó ở M8
        (`docs/22`), điền dòng giá rồi gửi; vòng đời ở `docs/14` mục 7.

        **Không giữ chỗ ở bất kỳ bước nào** (`docs/23` mục 7 điều 1): tour riêng
        không dùng tồn kho chung, nên không có gì để giữ và không có gì hết hạn.

        `requestedDate` sớm hơn `leadTimeDays` của sản phẩm →
        `422 LEAD_TIME_NOT_MET`. Lịch ở frontend phải chặn trước, backend vẫn
        kiểm lại (`docs/14` mục 7 quy tắc 1) — chặn ở một phía là chặn được đúng
        những người dùng trình duyệt.
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequestInput'
      responses:
        '201':
          description: Đã nhận yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteReceipt'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /api/v1/{market}/products/{slug}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Chi tiết một sản phẩm
      description: |
        `slug` **phụ thuộc locale**: cùng một tour có slug khác nhau ở `da` và
        `vi`, và slug của locale này không mở được ở locale kia.

        Trả về **đúng một** đối tượng con theo `productType` (ADR-005). Nhờ
        `discriminator`, generator sinh ra kiểu tổng — frontend quên xử lý một
        loại là lỗi biên dịch, không phải màn hình trắng.

        `404` gộp ba tình huống có chủ ý: không tồn tại, chưa dịch cho locale
        này, chưa gán vào thị trường này. Phân biệt ra ngoài là rò rỉ thông tin
        về sản phẩm chưa mở bán (`docs/13` mục 5.1).
      parameters:
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: slug
          in: path
          required: true
          description: Không dấu ở cả hai ngôn ngữ.
          schema:
            type: string
      responses:
        '200':
          description: Sản phẩm
          headers:
            Content-Language:
              schema: { type: string }
            Vary:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

components:

  parameters:

    Market:
      name: market
      in: path
      required: true
      description: |
        Mã thị trường, chữ thường trong đường dẫn. Quyết định khách **mua** gì:
        catalog, bảng giá, tiền tệ, cổng thanh toán, ràng buộc pháp lý.
        Không suy ra từ locale.
      schema:
        type: string
        enum: [dk, vn]

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID do **client sinh một lần cho một lần đặt**, không sinh lại ở mỗi
        lần thử. Gọi lại cùng khoá trong 24 giờ trả về **cùng kết quả cũ**, không
        tạo bản ghi thứ hai (`docs/13` mục 7).

        Chống ba thứ có thật: khách bấm nút hai lần, mạng di động gửi lại yêu cầu
        sau khi máy chủ đã xử lý xong, và khách bấm Back rồi bấm lại.
      schema:
        type: string
        format: uuid

    AdminId:
      name: id
      in: path
      required: true
      description: |
        Định danh nội bộ. Bề mặt quản trị dùng `id`, bề mặt công khai dùng `slug`
        — `docs/13` mục 4.
      schema:
        type: string
        format: uuid

    AcceptLanguage:
      name: Accept-Language
      in: header
      required: true
      description: |
        Locale, quyết định khách **đọc** bằng tiếng gì. Độc lập hoàn toàn với
        market: khách Việt sống ở Đan Mạch mua ở `dk` nhưng đọc `vi`.
      schema:
        type: string
        enum: [da, vi]

  responses:

    Error:
      description: Lỗi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    Region:
      type: object
      required: [slug, name, productCount]
      properties:
        slug:
          type: string
          description: Không dấu ở cả hai ngôn ngữ. Phụ thuộc locale.
          example: nordvietnam
        name:
          type: string
          example: Nordvietnam
        productCount:
          type: integer
          format: int32
          minimum: 0
          description: Đếm từ dữ liệu trong phạm vi (market, locale). Không hardcode.

    Destination:
      type: object
      description: |
        Một điểm đến, đã dịch sang locale đang xem, kèm miền chứa nó.
      required: [slug, name, region, productCount]
      properties:
        slug:
          type: string
          example: hanoi
        name:
          type: string
          example: Hanoi
        summary:
          type: string
          description: Bỏ hẳn khỏi JSON khi chưa có bản mô tả.
        region:
          $ref: '#/components/schemas/Ref'
        productCount:
          type: integer
          format: int32
          minimum: 0
          description: Đếm từ dữ liệu trong phạm vi (market, locale). Không hardcode.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }

    StaffProfile:
      type: object
      required: [id, email, displayName, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: [CONSULTANT, EDITOR, TRANSLATOR, ADMIN]

    TranslationStatus:
      type: string
      description: |
        `OUTDATED` **không có ở đây**: nó là giá trị tính ra từ thời điểm sửa bản
        nguồn so với thời điểm dịch, không ai nhập tay được (`docs/11` mục 6).
      enum: [DRAFT, TRANSLATED, PUBLISHED]

    AdminProductTranslationInput:
      type: object
      required: [slug, title, shortDescription, longDescription, whyChooseThis, heroImageAlt, status]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Không dấu ở cả hai ngôn ngữ — `docs/02` mục 5.1.
        title: { type: string, minLength: 1, maxLength: 200 }
        shortDescription: { type: string, minLength: 1 }
        longDescription:
          type: array
          items: { type: string }
          minItems: 2
        whyChooseThis:
          type: array
          items: { type: string }
          minItems: 3
          maxItems: 7
        heroImageAlt:
          type: string
          minLength: 1
          maxLength: 300
          description: Nội dung phải dịch, không phải siêu dữ liệu kỹ thuật — `docs/24` mục 6.
        status: { $ref: '#/components/schemas/TranslationStatus' }

    AdminProductTranslation:
      type: object
      required: [locale, slug, title, shortDescription, longDescription, whyChooseThis, heroImageAlt, status, isSource, lastModifiedAt]
      properties:
        locale: { type: string }
        slug: { type: string }
        title: { type: string }
        shortDescription: { type: string }
        longDescription:
          type: array
          items: { type: string }
        whyChooseThis:
          type: array
          items: { type: string }
        heroImageAlt: { type: string }
        status: { $ref: '#/components/schemas/TranslationStatus' }
        isSource:
          type: boolean
          description: Bản này có phải ngôn ngữ nguồn không — ADR-004.
        outdated:
          type: boolean
          description: |
            Tính ra, không lưu: bản nguồn sửa sau lần dịch gần nhất. Bỏ khỏi JSON
            với chính bản nguồn.
        lastModifiedAt: { type: string, format: date-time }
        lastModifiedBy: { type: string, format: uuid }

    TranslationGap:
      type: string
      enum: [MISSING, OUTDATED]
      description: |
        `MISSING` chưa có bản dịch nào. `OUTDATED` có rồi nhưng bản nguồn đã sửa
        sau đó. Cả hai đều **tính ra**, không cột nào trong CSDL lưu chúng.

    TranslationEntityType:
      type: string
      enum: [PRODUCT, POST]
      description: |
        Chỉ hai loại, và **đây là giới hạn của lược đồ chứ không phải của thiết
        kế**: `docs/22` mục 4.1 muốn cả điểm đến, nhưng
        `destination_translation` và `lecture_translation` không có cột `status`
        lẫn `translated_at`, nên với chúng thì "bản nguồn đã xuất bản chưa" và
        "dịch từ lúc nào" đều không trả lời được.

        Thêm hai cột đó là định nghĩa một vòng đời xuất bản cho điểm đến — thứ
        chưa tài liệu nào mô tả, và nó đụng thẳng vào chính sách không-fallback
        (`docs/02`). Vì thế: chờ quyết định, không tự thêm cột.

    AdminTranslationState:
      type: object
      required: [locale, status, isSource, outdated]
      properties:
        locale: { type: string, example: vi }
        status: { $ref: '#/components/schemas/TranslationStatus' }
        isSource:
          type: boolean
          description: Ngôn ngữ nguồn của hệ thống — ADR-004, hiện là `da`.
        outdated:
          type: boolean
          description: Với bản nguồn luôn `false` — nó không dịch từ đâu cả.

    AdminProductMarketState:
      type: object
      required: [market, published]
      properties:
        market:
          type: string
          enum: [DK, VN]
        published:
          type: boolean
          description: |
            Công tắc "bắt đầu bán được" (`docs/01` mục 4.4). Dịch xong mà chưa
            bật thì sản phẩm vẫn **không tồn tại** với khách.

    AdminProductSummary:
      type: object
      required: [id, productType, sourceTitle, sourceStatus, markets, translations]
      properties:
        id: { type: string, format: uuid }
        productType: { $ref: '#/components/schemas/ProductType' }
        sourceTitle:
          type: string
          description: |
            Tiêu đề bản ngôn ngữ nguồn. Luôn có: CSDL từ chối một sản phẩm không
            có bản dịch nguồn (`ct_product_source_translation`).
        sourceStatus: { $ref: '#/components/schemas/TranslationStatus' }
        markets:
          type: array
          items: { $ref: '#/components/schemas/AdminProductMarketState' }
          description: Rỗng nghĩa là **chưa gán thị trường nào**.
        translations:
          type: array
          items: { $ref: '#/components/schemas/AdminTranslationState' }
          description: |
            Chỉ những bản **đang tồn tại**. Locale vắng mặt ở đây là locale chưa
            dịch — frontend đối chiếu với danh sách locale đang bật.
        lastModifiedAt: { type: string, format: date-time }

    AdminProductPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminProductSummary' }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    TranslationQueueItem:
      type: object
      required: [entityType, id, locale, gap, priority, sourceTitle, sourceLastModifiedAt]
      properties:
        entityType: { $ref: '#/components/schemas/TranslationEntityType' }
        id: { type: string, format: uuid }
        locale:
          type: string
          description: Locale **đích** — thứ đang thiếu, không phải thứ đang có.
          example: vi
        gap: { $ref: '#/components/schemas/TranslationGap' }
        priority:
          type: integer
          format: int32
          minimum: 1
          maximum: 4
          description: |
            Bậc ưu tiên của `docs/22` mục 4.1.1, thấp là gấp:

            | | |
            |---|---|
            | 1 | Sản phẩm đã gán thị trường và **đang bán** — chưa dịch là mất doanh thu ngay |
            | 2 | Sản phẩm đã xuất bản bản nguồn, chưa gán thị trường |
            | 3 | Dành cho điểm đến — chưa dùng, xem `TranslationEntityType` |
            | 4 | Bài viết, sự kiện |
        sourceTitle: { type: string }
        sourceLastModifiedAt:
          type: string
          format: date-time
          description: Với `OUTDATED`, đây là **lý do** nó quay lại hàng đợi.
        translatedAt:
          type: string
          format: date-time
          description: Bỏ hẳn khỏi JSON khi chưa dịch lần nào.

    TranslationCoverageRow:
      type: object
      required: [entityType, locale, total, translated, upToDate]
      properties:
        entityType: { $ref: '#/components/schemas/TranslationEntityType' }
        locale: { type: string, example: vi }
        total:
          type: integer
          format: int32
          minimum: 0
          description: |
            Mẫu số: số bản ghi có bản nguồn ở trạng thái `PUBLISHED`. Bản nguồn
            còn là nháp thì chưa đến lượt dịch, nên không tính vào mẫu số.
        translated:
          type: integer
          format: int32
          minimum: 0
        upToDate:
          type: integer
          format: int32
          minimum: 0
          description: Đã dịch **và** không `OUTDATED`. Luôn `<= translated`.


    GroupTourFields:
      type: object
      required: [minPax, maxPax, guaranteedThreshold, tourLeaderLanguage, fitnessLevel]
      properties:
        minPax: { type: integer, format: int32, minimum: 10, maximum: 25 }
        maxPax: { type: integer, format: int32, minimum: 10, maximum: 25 }
        guaranteedThreshold:
          type: integer
          format: int32
          minimum: 1
          description: |
            Số khách để chuyến **chắc chắn khởi hành**. Không lớn hơn `minPax`.
            Trạng thái `GUARANTEED` tính từ ngưỡng này, không ai nhập tay.
        tourLeaderLanguage:
          type: string
          enum: [da, vi]
          description: |
            Ngôn ngữ của trưởng đoàn. **Không phải** locale khách đang đọc —
            khách Việt ở Đan Mạch đọc `vi` nhưng đi đoàn có trưởng đoàn nói `da`.
        fitnessLevel: { type: integer, format: int32, minimum: 1, maximum: 4 }

    IndividualPackageFields:
      type: object
      required: [minPartySize, flexibleDateWindowDays]
      properties:
        minPartySize: { type: integer, format: int32, minimum: 1 }
        flexibleDateWindowDays: { type: integer, format: int32, minimum: 0, maximum: 30 }

    PrivateTourFields:
      type: object
      required: [leadTimeDays, quoteValidDays]
      properties:
        leadTimeDays: { type: integer, format: int32, minimum: 1, maximum: 90 }
        quoteValidDays: { type: integer, format: int32, minimum: 1, maximum: 30 }

    CruiseFields:
      type: object
      required: [shipName, portCount]
      properties:
        shipName: { type: string, maxLength: 120 }
        portCount: { type: integer, format: int32, minimum: 1 }

    ComboFields:
      type: object
      required: [nights, validFrom, validTo]
      properties:
        nights: { type: integer, format: int32, minimum: 1, maximum: 14 }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }

    DayTourFields:
      type: object
      required: [durationHours, cutoffHours]
      properties:
        durationHours: { type: integer, format: int32, minimum: 1, maximum: 24 }
        cutoffHours: { type: integer, format: int32, minimum: 0 }

    AdminProductCreate:
      type: object
      description: |
        Sáu khối riêng của loại đều **không bắt buộc ở tầng schema**, và đúng một
        khối bắt buộc ở tầng nghiệp vụ — khối khớp với `productType`.

        **Phương án đã cân nhắc và bị loại:** `oneOf` kèm discriminator. Nó tự mô
        tả hơn, nhưng bộ sinh mã phải sinh cả nhánh giải mã đa hình cho thân yêu
        cầu, và ở dự án này thì `productType` đã một lần buộc phải hạ xuống
        `string` trần vì bộ sinh mã đối xử khác nhau giữa lớp cha và lớp con.
        Một trường lỗi rõ ràng đọc được đáng giá hơn một schema đẹp hơn.
      required: [productType, primaryDestinationId, heroImage, source]
      properties:
        productType: { $ref: '#/components/schemas/ProductType' }
        primaryDestinationId: { type: string, format: uuid }
        durationDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          description: |
            Bỏ trống với `DAY_TOUR` và **chỉ** với `DAY_TOUR` — ràng buộc
            `ck_product_duration` cưỡng chế cả hai chiều.
        heroImage: { type: string, maxLength: 500 }
        mapImage: { type: string, maxLength: 500 }
        layout:
          type: string
          maxLength: 40
          description: |
            Template trang chi tiết. Bỏ trống thì dùng template mặc định của
            loại — xem `ProductDetailBase.layout`.
        isNew: { type: boolean, default: false }
        consultantId: { type: string, format: uuid }
        source:
          allOf: [{ $ref: '#/components/schemas/AdminProductTranslationInput' }]
          description: Bản dịch **ngôn ngữ nguồn** — ADR-004, hiện là `da`.
        groupTour: { $ref: '#/components/schemas/GroupTourFields' }
        individualPackage: { $ref: '#/components/schemas/IndividualPackageFields' }
        privateTour: { $ref: '#/components/schemas/PrivateTourFields' }
        cruise: { $ref: '#/components/schemas/CruiseFields' }
        combo: { $ref: '#/components/schemas/ComboFields' }
        dayTour: { $ref: '#/components/schemas/DayTourFields' }

    AdminProductPatch:
      type: object
      description: |
        Không có `productType` và không có `source`: loại không đổi được sau khi
        tạo (`docs/22` mục 7), còn bản dịch sửa qua
        `PUT /admin/products/{id}/translations/{locale}` — nơi quyền phụ thuộc
        locale đang sửa.
      properties:
        primaryDestinationId: { type: string, format: uuid }
        durationDays: { type: integer, format: int32, minimum: 1, maximum: 60 }
        heroImage: { type: string, maxLength: 500 }
        mapImage: { type: string, maxLength: 500 }
        layout: { type: string, maxLength: 40 }
        isNew: { type: boolean }
        consultantId: { type: string, format: uuid }
        groupTour: { $ref: '#/components/schemas/GroupTourFields' }
        individualPackage: { $ref: '#/components/schemas/IndividualPackageFields' }
        privateTour: { $ref: '#/components/schemas/PrivateTourFields' }
        cruise: { $ref: '#/components/schemas/CruiseFields' }
        combo: { $ref: '#/components/schemas/ComboFields' }
        dayTour: { $ref: '#/components/schemas/DayTourFields' }

    AdminProductDetail:
      type: object
      required: [id, productType, primaryDestinationId, heroImage, isNew, reviewCount, markets, translations]
      properties:
        id: { type: string, format: uuid }
        productType: { $ref: '#/components/schemas/ProductType' }
        primaryDestinationId: { type: string, format: uuid }
        durationDays: { type: integer, format: int32 }
        heroImage: { type: string }
        mapImage: { type: string }
        layout: { type: string }
        isNew: { type: boolean }
        rating: { type: number, format: double }
        reviewCount: { type: integer, format: int32 }
        consultantId: { type: string, format: uuid }
        markets:
          type: array
          items: { $ref: '#/components/schemas/AdminProductMarketState' }
        translations:
          type: array
          items: { $ref: '#/components/schemas/AdminTranslationState' }
        groupTour: { $ref: '#/components/schemas/GroupTourFields' }
        individualPackage: { $ref: '#/components/schemas/IndividualPackageFields' }
        privateTour: { $ref: '#/components/schemas/PrivateTourFields' }
        cruise: { $ref: '#/components/schemas/CruiseFields' }
        combo: { $ref: '#/components/schemas/ComboFields' }
        dayTour: { $ref: '#/components/schemas/DayTourFields' }
        lastModifiedAt: { type: string, format: date-time }
        lastModifiedBy: { type: string, format: uuid }

    AdminMarketAssignment:
      type: object
      required: [published]
      properties:
        published:
          type: boolean
          description: |
            Bật là **bắt đầu bán**. Tắt là ngừng bán ngay: sản phẩm biến khỏi
            listing của thị trường đó, nhưng đơn đã đặt không bị ảnh hưởng.

    AdminPriceTierInput:
      type: object
      required: [minPax, pricePerPerson]
      properties:
        minPax: { type: integer, format: int32, minimum: 1 }
        maxPax:
          type: integer
          format: int32
          minimum: 1
          description: |
            Bỏ trống = không có trần. Chỉ **bậc cuối** được bỏ trống; để trần ở
            bậc cuối cũng hợp lệ.
        pricePerPerson:
          type: string
          pattern: '^\d+(\.\d+)?$'
          description: Chuỗi, không phải số JSON — cùng lý do với `Money`.

    AdminPriceTier:
      type: object
      required: [id, market, minPax, pricePerPerson]
      properties:
        id: { type: string, format: uuid }
        market: { type: string, enum: [DK, VN] }
        minPax: { type: integer, format: int32 }
        maxPax: { type: integer, format: int32 }
        pricePerPerson: { $ref: '#/components/schemas/Money' }

    AdminDepartureCreate:
      type: object
      required: [market, departDate, days, capacity]
      properties:
        market: { type: string, enum: [DK, VN] }
        departDate: { type: string, format: date }
        days: { type: integer, format: int32, minimum: 1, maximum: 60 }
        capacity: { type: integer, format: int32, minimum: 1 }
        cabinCategory:
          type: string
          enum: [INSIDE, OUTSIDE, BALCONY, AQUA]
          description: Chỉ `CRUISE`. Loại khác gửi lên là `400`.
        baseStatus:
          type: string
          enum: [OPEN, FEW_SEATS, SOLD_OUT, PENDING]
          default: OPEN
        departureOriginId: { type: string, format: uuid }

    AdminDeparturePatch:
      type: object
      description: |
        Không có `returnDate` (tính ra), không có `seatsBooked` (hệ quả của đơn
        đặt), không có `market` (đổi thị trường của một ngày đã có đơn là đổi cả
        tiền tệ của những đơn đó).
      properties:
        departDate: { type: string, format: date }
        days: { type: integer, format: int32, minimum: 1, maximum: 60 }
        capacity: { type: integer, format: int32, minimum: 1 }
        cabinCategory: { type: string, enum: [INSIDE, OUTSIDE, BALCONY, AQUA] }
        baseStatus: { type: string, enum: [OPEN, FEW_SEATS, SOLD_OUT, PENDING] }
        departureOriginId: { type: string, format: uuid }

    AdminDestination:
      type: object
      required: [id, code, name, regionName]
      properties:
        id: { type: string, format: uuid }
        code:
          type: string
          description: Mã nội bộ, không đổi — `HANOI`, `HOI_AN`.
        name:
          type: string
          description: Tên ở **ngôn ngữ nguồn** (ADR-004). Trang quản trị dùng một ngôn ngữ.
        regionName: { type: string }
    AdminDeparture:
      type: object
      required: [id, market, departDate, returnDate, days, baseStatus, capacity, seatsBooked, prices]
      properties:
        id: { type: string, format: uuid }
        market: { type: string, enum: [DK, VN] }
        departDate: { type: string, format: date }
        returnDate: { type: string, format: date }
        days: { type: integer, format: int32 }
        cabinCategory: { type: string }
        baseStatus: { type: string }
        capacity: { type: integer, format: int32 }
        seatsBooked: { type: integer, format: int32 }
        departureOriginId: { type: string, format: uuid }
        prices:
          type: array
          items: { $ref: '#/components/schemas/AdminDeparturePrice' }
          description: |
            Rỗng nghĩa là **chưa có giá** — ngày khởi hành tồn tại nhưng chưa bán
            được. Trang quản trị phải hiện rõ điều đó (`docs/22` mục 5).

    AdminDeparturePriceInput:
      type: object
      required: [paxTypeCode, occupancy, amount]
      properties:
        paxTypeCode:
          type: string
          maxLength: 16
          example: ADULT
          description: Tra trong thị trường của chính ngày khởi hành này.
        occupancy: { type: string, enum: [DOUBLE, SINGLE] }
        amount:
          type: string
          pattern: '^\d+(\.\d+)?$'

    AdminDeparturePrice:
      type: object
      required: [paxTypeCode, occupancy, amount]
      properties:
        paxTypeCode: { type: string }
        occupancy: { type: string }
        amount: { $ref: '#/components/schemas/Money' }

    AdminDepartureCopy:
      type: object
      required: [fromMarket, toMarket]
      properties:
        fromMarket: { type: string, enum: [DK, VN] }
        toMarket: { type: string, enum: [DK, VN] }
        fromDate:
          type: string
          format: date
          description: Chỉ nhân bản ngày đi từ mốc này trở đi. Bỏ trống là tất cả.

    AdminDepartureCopyResult:
      type: object
      required: [created, skipped]
      properties:
        created:
          type: integer
          format: int32
          description: Số ngày khởi hành mới, **chưa có giá**.
        skipped:
          type: integer
          format: int32
          description: Số ngày đã tồn tại ở thị trường đích nên bỏ qua.

    AdminBookingScope:
      type: string
      description: |
        Phạm vi mặc định của danh sách đơn (`docs/22` mục 6).

        `NEEDS_ACTION` = `DRAFT`, `PENDING_PAYMENT`, `PENDING_CONFIRMATION` —
        ba trạng thái mà nhân viên còn nợ khách một hành động. Bốn trạng thái
        còn lại (`CONFIRMED`, `COMPLETED`, `CANCELLED`, `REFUNDED`, `EXPIRED`)
        đã kết thúc phần việc của nhân viên.
      enum: [NEEDS_ACTION, ALL]

    AdminBookingSummary:
      type: object
      required: [id, reference, status, market, locale, productTitle, paxCount, total, contactEmail, createdAt]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        market:
          type: string
          enum: [DK, VN]
        locale:
          type: string
          description: |
            Ngôn ngữ khách **đã đặt bằng**. Nhân viên gọi lại thì cần biết nói
            tiếng gì — và nó độc lập với thị trường: khách Việt sống ở Đan Mạch
            đặt ở `DK` mà đọc `vi` (`docs/02`).
        productTitle:
          type: string
          description: Chụp lại lúc đặt, không đọc từ bản dịch hiện tại.
        departDate:
          type: string
          format: date
          description: Vắng với `PRIVATE_TOUR` và `COMBO` — hai loại không có `departure`.
        paxCount:
          type: integer
          format: int32
          description: Đếm từ `booking_passenger`, không phải một cột lưu sẵn.
        total: { $ref: '#/components/schemas/Money' }
        contactEmail: { type: string }
        createdAt: { type: string, format: date-time }

    AdminBookingPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminBookingSummary' }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    AdminBookingTargetStatus:
      type: string
      description: |
        Bốn trạng thái **nhân viên** đặt được. Tập con của `BookingStatus`, cố ý
        hẹp hơn: `PENDING_PAYMENT`, `PENDING_CONFIRMATION` và `EXPIRED` do luồng
        thanh toán và job quét hạn sinh ra, đặt tay được là ghi vào nhật ký một
        việc chưa từng xảy ra.
      enum: [CONFIRMED, COMPLETED, CANCELLED, REFUNDED]

    AdminBookingStatusChange:
      type: object
      required: [toStatus]
      properties:
        toStatus: { $ref: '#/components/schemas/AdminBookingTargetStatus' }
        note:
          type: string
          maxLength: 500
          description: |
            Vì sao đổi. Đi thẳng vào dòng `booking_event` vừa sinh ra — nơi duy
            nhất giữ được lý do, vì bảng `booking` chỉ giữ trạng thái **hiện
            tại**.

    AdminBookingPassenger:
      type: object
      required: [seq, paxTypeCode, fullName]
      properties:
        seq: { type: integer, format: int32 }
        paxTypeCode: { type: string }
        fullName: { type: string }
        dateOfBirth: { type: string, format: date }
        passportNo: { type: string }
        passportExpiry: { type: string, format: date }
        nationality: { type: string, minLength: 2, maxLength: 2 }

    AdminBookingEvent:
      type: object
      required: [id, toStatus, actorType, createdAt]
      properties:
        id: { type: string, format: uuid }
        fromStatus:
          allOf: [{ $ref: '#/components/schemas/BookingStatus' }]
          description: Vắng ở **dòng đầu tiên** — đơn vừa sinh ra không đến từ trạng thái nào.
        toStatus: { $ref: '#/components/schemas/BookingStatus' }
        actorType:
          type: string
          enum: [CUSTOMER, STAFF, SYSTEM]
        actorId: { type: string, format: uuid }
        actorName:
          type: string
          description: |
            Tên hiển thị của nhân viên, chỉ có khi `actorType = STAFF`. Đọc từ
            `staff_user` lúc trả về chứ **không** chụp lại vào nhật ký: đổi tên
            hiển thị thì mọi dòng cũ cũng đổi theo, và đó là hành vi đúng — nhật
            ký ghi *ai*, không ghi *tên gọi lúc đó*.
        note: { type: string }
        createdAt: { type: string, format: date-time }

    AdminBookingDetail:
      type: object
      required: [id, reference, status, market, locale, productId, productTitle,
                 contactEmail, contactPhone, createdAt, breakdown, passengers, events]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        market:
          type: string
          enum: [DK, VN]
        locale: { type: string }
        productId: { type: string, format: uuid }
        productTitle: { type: string }
        departureId: { type: string, format: uuid }
        departDate: { type: string, format: date }
        contactEmail: { type: string }
        contactPhone: { type: string }
        createdAt: { type: string, format: date-time }
        breakdown:
          allOf: [{ $ref: '#/components/schemas/PriceBreakdown' }]
          description: |
            Dòng giá **chụp lại lúc đặt** (`booking_line`), không tính lại từ
            bảng giá hiện tại.
        passengers:
          type: array
          items: { $ref: '#/components/schemas/AdminBookingPassenger' }
        events:
          type: array
          items: { $ref: '#/components/schemas/AdminBookingEvent' }
          description: |
            **Toàn bộ** nhật ký, cũ nhất trước. Không phân trang, không cắt bớt.

    QuoteStatus:
      type: string
      description: Vòng đời ở `docs/14` mục 7. Không có bước lùi.
      enum: [DRAFT, SENT, ACCEPTED, REJECTED, EXPIRED]

    QuoteRequestInput:
      type: object
      required: [productSlug, partySize, contactName, contactEmail, contactPhone]
      properties:
        productSlug:
          type: string
          description: |
            Slug **của locale đang đọc** — cùng một tour có slug khác nhau ở `da`
            và `vi`. Bề mặt công khai dùng slug, không dùng `id` (`docs/13` mục 4).
          maxLength: 200
        partySize:
          type: integer
          format: int32
          minimum: 1
          maximum: 40
          description: Số người dự kiến. Khách đổi được lúc trao đổi với tư vấn viên.
        requestedDate:
          type: string
          format: date
          description: |
            Ngày khách muốn khởi hành. Sớm hơn `leadTimeDays` của sản phẩm →
            `422 LEAD_TIME_NOT_MET`.
        contactName: { type: string, minLength: 1, maxLength: 160 }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, minLength: 5, maxLength: 32 }
        message:
          type: string
          maxLength: 2000
          description: Yêu cầu riêng của khách — thứ bảng giá tĩnh không diễn đạt được.

    QuoteReceipt:
      type: object
      required: [reference, status, createdAt]
      properties:
        reference:
          type: string
          description: |
            Mã báo giá. Khách đọc mã này qua điện thoại, nên nó theo cùng bộ chữ
            cái với mã đơn — không có I, O, 0, 1.
        status: { $ref: '#/components/schemas/QuoteStatus' }
        createdAt: { type: string, format: date-time }

    AdminQuoteFilter:
      type: string
      description: |
        Bộ lọc trạng thái của danh sách M8. `ALL` là **giá trị thứ sáu**, không
        phải một trạng thái — nó không bao giờ nằm trong CSDL.
      enum: [DRAFT, SENT, ACCEPTED, REJECTED, EXPIRED, ALL]

    QuoteLineInput:
      type: object
      required: [labelKey, amount]
      properties:
        labelKey:
          type: string
          maxLength: 64
          description: |
            **Khoá chuỗi, không phải câu tiếng người** — cùng luật với
            `booking_line`. Báo giá in ra được ở cả hai ngôn ngữ vì dòng của nó
            không mang sẵn tiếng nào.
        quantity: { type: string, pattern: '^-?\d+(\.\d+)?$' }
        unitAmount: { type: string, pattern: '^-?\d+(\.\d+)?$' }
        amount:
          type: string
          pattern: '^-?\d+(\.\d+)?$'
          description: Âm = giảm trừ, cùng quy ước với `booking_line`.

    AdminQuoteLinesInput:
      type: object
      required: [currency, lines]
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: |
            Tiền tệ của **thị trường báo giá**, không quy đổi từ thị trường kia.
            Sai tiền tệ so với thị trường của báo giá → `400 VALIDATION_FAILED`.
        lines:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: '#/components/schemas/QuoteLineInput' }

    QuoteLine:
      type: object
      required: [seq, labelKey, amount]
      properties:
        seq: { type: integer, format: int32 }
        labelKey: { type: string }
        quantity: { type: string }
        unitAmount: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }

    AdminQuoteTargetStatus:
      type: string
      description: |
        Ba trạng thái **người** đặt được. `DRAFT` là điểm xuất phát nên không ai
        quay lại nó; `EXPIRED` do job sinh ra (`docs/14` mục 7).
      enum: [SENT, ACCEPTED, REJECTED]

    AdminQuoteStatusChange:
      type: object
      required: [toStatus]
      properties:
        toStatus: { $ref: '#/components/schemas/AdminQuoteTargetStatus' }

    AdminQuoteSummary:
      type: object
      required: [id, reference, status, market, locale, productId, productTitle,
                 partySize, contactName, contactEmail, createdAt]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/QuoteStatus' }
        market:
          type: string
          enum: [DK, VN]
        locale:
          type: string
          description: |
            Ngôn ngữ khách đã gửi yêu cầu bằng. Tư vấn viên gọi lại thì cần biết
            nói tiếng gì — độc lập với thị trường (`docs/02`).
        productId: { type: string, format: uuid }
        productTitle:
          type: string
          description: |
            Đọc từ bản dịch **theo locale của báo giá**. Khác `booking`: đơn chụp
            lại tên lúc đặt vì nó là chứng từ, còn báo giá chưa chốt gì nên tên
            hiện tại mới là tên đúng.
        partySize: { type: integer, format: int32 }
        requestedDate: { type: string, format: date }
        contactName: { type: string }
        contactEmail: { type: string }
        total:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Vắng khi chưa ai dựng bảng giá.
        validUntil:
          type: string
          format: date
          description: Vắng cho tới lúc gửi. Đặt lúc chuyển sang `SENT`.
        createdAt: { type: string, format: date-time }

    AdminQuotePage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminQuoteSummary' }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    AdminQuoteDetail:
      allOf:
        - $ref: '#/components/schemas/AdminQuoteSummary'
        - type: object
          required: [contactPhone, lines]
          properties:
            contactPhone: { type: string }
            message: { type: string }
            leadTimeDays:
              type: integer
              format: int32
              description: Của sản phẩm, để màn hình giải thích được vì sao ngày bị từ chối.
            quoteValidDays:
              type: integer
              format: int32
              description: Số ngày báo giá còn hiệu lực kể từ lúc gửi.
            lines:
              type: array
              items: { $ref: '#/components/schemas/QuoteLine' }
              description: Rỗng khi chưa ai dựng bảng giá.

    AdminContentLocaleState:
      type: string
      description: |
        Một locale của một bản ghi nội dung đang ở đâu. Dùng cho cột "đã dịch
        chưa" của danh sách M13 — cùng ba giá trị với `product_translation`, để
        hai bề mặt không gọi cùng một trạng thái bằng hai cái tên.
      enum: [MISSING, DRAFT, TRANSLATED, PUBLISHED]

    AdminDestinationTranslationInput:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          maxLength: 160
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: |
            **Không ký tự có dấu** ở cả hai ngôn ngữ (`CLAUDE.md` quy tắc 7):
            `hoi-an` chứ không `hội-an`, `halong-bugten` chứ không
            `halong-bugten` có `æ ø å`. Cơ sở dữ liệu cũng từ chối bằng
            `ck_dt_slug`, nhưng báo sớm hơn thì đỡ mất một lần gõ lại.
        name: { type: string, minLength: 1, maxLength: 120 }
        summary: { type: string }

    AdminDestinationTranslation:
      type: object
      required: [locale, slug, name, isSource]
      properties:
        locale: { type: string }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        isSource:
          type: boolean
          description: Bản `da` — ngôn ngữ nguồn (ADR-004).
        lastModifiedAt: { type: string, format: date-time }
        lastModifiedBy: { type: string }

    AdminDestinationPatch:
      type: object
      properties:
        regionId: { type: string, format: uuid }
        sortOrder: { type: integer, format: int32, minimum: 0, maximum: 999 }

    AdminDestinationDetail:
      type: object
      required: [id, code, regionId, regionName, sortOrder, translations]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        regionId: { type: string, format: uuid }
        regionName: { type: string }
        sortOrder: { type: integer, format: int32 }
        productCount:
          type: integer
          format: int32
          description: |
            Số sản phẩm đang trỏ tới điểm đến này. Màn hình cần nó để nói trước
            hậu quả của nút Xoá thay vì để người dùng gặp `409`.
        translations:
          type: array
          items: { $ref: '#/components/schemas/AdminDestinationTranslation' }
        lastModifiedAt: { type: string, format: date-time }
        lastModifiedBy: { type: string }

    AdminTag:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name:
          type: string
          description: Tên ở **ngôn ngữ nguồn**. Trang quản trị dùng một ngôn ngữ.

    AdminPostTranslationInput:
      type: object
      required: [slug, title, excerpt, body, status]
      properties:
        slug:
          type: string
          maxLength: 160
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        title: { type: string, minLength: 1, maxLength: 200 }
        excerpt: { type: string, minLength: 1 }
        body:
          type: array
          minItems: 1
          items: { type: string }
          description: |
            **Từng đoạn văn một, không phải một khối HTML.** Nội dung do biên tập
            viên nhập, và HTML tự do đi thẳng từ cơ sở dữ liệu ra trang là một lỗ
            chèn mã chờ sẵn.
        status: { $ref: '#/components/schemas/TranslationStatus' }

    AdminPostTranslation:
      type: object
      required: [locale, slug, title, excerpt, body, status, isSource]
      properties:
        locale: { type: string }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        body:
          type: array
          items: { type: string }
        status: { $ref: '#/components/schemas/TranslationStatus' }
        isSource: { type: boolean }
        lastModifiedAt: { type: string, format: date-time }
        lastModifiedBy: { type: string }

    AdminPostCreate:
      type: object
      required: [translation]
      properties:
        heroImage: { type: string }
        publishedAt:
          type: string
          format: date-time
          description: |
            Vắng nghĩa là **chưa xuất bản theo lịch**. Trạng thái xuất bản thật
            nằm ở `status` của từng bản dịch; trường này chỉ là ngày hiện trên
            trang, và hai thứ đó cố tình tách nhau.
        tagIds:
          type: array
          items: { type: string, format: uuid }
        translation:
          allOf: [{ $ref: '#/components/schemas/AdminPostTranslationInput' }]
          description: Bản **ngôn ngữ nguồn** (`da`). Bắt buộc — xem mô tả endpoint.

    AdminPostPatch:
      type: object
      properties:
        heroImage: { type: string }
        publishedAt: { type: string, format: date-time }

    AdminPostTagAssignment:
      type: object
      required: [tagIds]
      properties:
        tagIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            Tập thẻ **sau khi** lưu. Mảng rỗng là gỡ hết — ở đây không có nhập
            nhằng nào, vì trường là bắt buộc và người gọi luôn nói rõ ý mình.

    AdminPostSummary:
      type: object
      required: [id, title, locales, tags]
      properties:
        id: { type: string, format: uuid }
        title:
          type: string
          description: Tiêu đề ở ngôn ngữ nguồn, hoặc ở locale nào có nếu bản nguồn thiếu.
        heroImage: { type: string }
        publishedAt: { type: string, format: date-time }
        locales:
          type: object
          additionalProperties: { $ref: '#/components/schemas/AdminContentLocaleState' }
          description: |
            Trạng thái từng locale, khoá là mã locale. Đây là cột quan trọng nhất
            của danh sách: `MISSING` ở `vi` nghĩa là bài này **không tồn tại** với
            khách đọc tiếng Việt.
        tags:
          type: array
          items: { $ref: '#/components/schemas/AdminTag' }
        lastModifiedAt: { type: string, format: date-time }
        lastModifiedBy: { type: string }

    AdminPostPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminPostSummary' }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    AdminPostDetail:
      type: object
      required: [id, tags, translations]
      properties:
        id: { type: string, format: uuid }
        heroImage: { type: string }
        publishedAt: { type: string, format: date-time }
        tags:
          type: array
          items: { $ref: '#/components/schemas/AdminTag' }
        translations:
          type: array
          items: { $ref: '#/components/schemas/AdminPostTranslation' }
        lastModifiedAt: { type: string, format: date-time }
        lastModifiedBy: { type: string }

    AdminLectureTranslationInput:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1 }

    AdminLectureTranslation:
      type: object
      required: [locale, title, description, isSource]
      properties:
        locale: { type: string }
        title: { type: string }
        description: { type: string }
        isSource: { type: boolean }
        lastModifiedAt: { type: string, format: date-time }
        lastModifiedBy: { type: string }

    AdminLectureCreate:
      type: object
      required: [market, eventDate, city, seats, translation]
      properties:
        market:
          type: string
          enum: [DK, VN]
          description: |
            Buổi thuyết trình thuộc **một thị trường**, không phải một ngôn ngữ:
            buổi ở København thuộc `DK` dù nói bằng tiếng gì. Bản dịch của nó thì
            vẫn có cả hai locale.
        eventDate: { type: string, format: date }
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Giờ địa phương, dạng `HH:MM`.
        city: { type: string, minLength: 1, maxLength: 64 }
        venue: { type: string, maxLength: 160 }
        seats: { type: integer, format: int32, minimum: 1, maximum: 5000 }
        translation:
          allOf: [{ $ref: '#/components/schemas/AdminLectureTranslationInput' }]
          description: Bản **ngôn ngữ nguồn** (`da`).

    AdminLecturePatch:
      type: object
      properties:
        eventDate: { type: string, format: date }
        startTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        city: { type: string, minLength: 1, maxLength: 64 }
        venue: { type: string, maxLength: 160 }
        seats: { type: integer, format: int32, minimum: 1, maximum: 5000 }

    AdminLectureSummary:
      type: object
      required: [id, market, eventDate, city, seats, seatsTaken, title, locales]
      properties:
        id: { type: string, format: uuid }
        market:
          type: string
          enum: [DK, VN]
        eventDate: { type: string, format: date }
        startTime: { type: string }
        city: { type: string }
        venue: { type: string }
        seats: { type: integer, format: int32 }
        seatsTaken:
          type: integer
          format: int32
          description: |
            Số đã đăng ký. Bề mặt khách trả **chỗ còn lại** vì đó là thứ khách
            quyết định theo; bề mặt quản trị trả cả hai vế, vì nhân viên cần biết
            sức chứa hạ được tới đâu.
        title: { type: string }
        locales:
          type: object
          additionalProperties: { $ref: '#/components/schemas/AdminContentLocaleState' }
        lastModifiedAt: { type: string, format: date-time }
        lastModifiedBy: { type: string }

    AdminLecturePage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminLectureSummary' }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1 }
        totalItems: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    AdminLectureDetail:
      type: object
      required: [id, market, eventDate, city, seats, seatsTaken, translations]
      properties:
        id: { type: string, format: uuid }
        market:
          type: string
          enum: [DK, VN]
        eventDate: { type: string, format: date }
        startTime: { type: string }
        city: { type: string }
        venue: { type: string }
        seats: { type: integer, format: int32 }
        seatsTaken: { type: integer, format: int32 }
        translations:
          type: array
          items: { $ref: '#/components/schemas/AdminLectureTranslation' }
        lastModifiedAt: { type: string, format: date-time }
        lastModifiedBy: { type: string }

    AdminStaffUser:
      type: object
      required: [id, email, displayName, isActive, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        isActive: { type: boolean }
        roles:
          type: array
          items: { type: string, enum: [CONSULTANT, EDITOR, TRANSLATOR, ADMIN] }
          description: |
            Một người mang được **nhiều** vai trò — ở công ty quy mô này, một
            người thường vừa viết vừa dịch (`docs/22` mục 2). Quyền vẫn tính theo
            vai trò, để lúc đội lớn lên thì không phải viết lại.

    AdminStaffUserPatch:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        isActive: { type: boolean }

    AdminRoleAssignment:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string, enum: [CONSULTANT, EDITOR, TRANSLATOR, ADMIN] }
          description: |
            Tập vai trò **sau khi** lưu. Mảng rỗng nghĩa là người này đăng nhập
            được nhưng không thấy màn hình nào — trạng thái hợp lệ, dùng cho
            người mới chờ phân việc.

    PaxCount:
      type: object
      required: [paxTypeCode, count]
      properties:
        paxTypeCode:
          type: string
          example: ADULT
        count:
          type: integer
          format: int32
          minimum: 0

    PricingRequest:
      type: object
      required: [departureId, pax]
      properties:
        departureId:
          type: string
          format: uuid
        pax:
          type: array
          items: { $ref: '#/components/schemas/PaxCount' }
          minItems: 1
        singleTravellers:
          type: integer
          format: int32
          minimum: 0
          default: 0
          description: Số khách ở một mình — mỗi người sinh một phần phụ thu phòng đơn.
        departureOriginId:
          type: string
          format: uuid
          description: Chỉ thị trường có nhiều điểm khởi hành.

    PriceLine:
      type: object
      required: [kind, labelKey, amount]
      properties:
        kind:
          type: string
          enum: [BASE, SINGLE_SUPPLEMENT, CABIN_UPGRADE, DEPARTURE_ORIGIN,
                 INSURANCE, PRE_TOUR_HOTEL, EARLY_BIRD_DISCOUNT, PROCESSING_FEE]
        labelKey:
          type: string
          description: |
            **Khoá chuỗi, không phải câu tiếng người.** Frontend dịch — cùng một
            đơn in ra được ở cả hai ngôn ngữ (`docs/13` mục 5).
        quantity:
          type: string
          description: Số lượng dạng chuỗi, cùng lý do với tiền.
        unitAmount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]

    PriceBreakdown:
      type: object
      required: [lines, total, deposit, balance]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/PriceLine' }
          description: Dòng bằng 0 **không xuất hiện** — `docs/14` mục 2.2.
        total: { $ref: '#/components/schemas/Money' }
        deposit:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Làm tròn **xuống**; `deposit + balance` luôn bằng `total`.
        balance: { $ref: '#/components/schemas/Money' }

    SeatHoldRequest:
      type: object
      required: [departureId, seats]
      properties:
        departureId: { type: string, format: uuid }
        seats: { type: integer, format: int32, minimum: 1, maximum: 20 }

    SeatHold:
      type: object
      required: [id, departureId, seats, expiresAt]
      properties:
        id: { type: string, format: uuid }
        departureId: { type: string, format: uuid }
        seats: { type: integer, format: int32 }
        expiresAt:
          type: string
          format: date-time
          description: |
            Frontend hiện bằng **chữ** — "Chúng tôi giữ chỗ cho bạn tới 14:32" —
            không dùng đồng hồ đếm ngược nhấp nháy (`docs/23` mục 3.2).

    PassengerInput:
      type: object
      required: [paxTypeCode, fullName]
      properties:
        paxTypeCode: { type: string }
        fullName: { type: string, minLength: 1, maxLength: 160 }
        dateOfBirth: { type: string, format: date }
        nationality: { type: string, minLength: 2, maxLength: 2 }

    BookingRequest:
      type: object
      required: [departureId, pax, passengers, contactEmail, contactPhone]
      properties:
        departureId: { type: string, format: uuid }
        seatHoldId:
          type: string
          format: uuid
          description: Bắt buộc với loại sản phẩm có tồn kho.
        pax:
          type: array
          items: { $ref: '#/components/schemas/PaxCount' }
          minItems: 1
        singleTravellers: { type: integer, format: int32, minimum: 0, default: 0 }
        departureOriginId: { type: string, format: uuid }
        passengers:
          type: array
          items: { $ref: '#/components/schemas/PassengerInput' }
          minItems: 1
        contactEmail: { type: string, format: email }
        contactPhone: { type: string, minLength: 5, maxLength: 32 }

    BookingStatus:
      type: string
      description: Máy trạng thái ở `docs/23` mục 4. Không có bước lùi.
      enum: [DRAFT, PENDING_PAYMENT, PENDING_CONFIRMATION, CONFIRMED,
             COMPLETED, CANCELLED, REFUNDED, EXPIRED]

    Booking:
      type: object
      required: [reference, status, productTitle, total, deposit, balance, lines]
      properties:
        reference:
          type: string
          description: Mã tra cứu khách đọc qua điện thoại cho tổng đài.
        status: { $ref: '#/components/schemas/BookingStatus' }
        productTitle:
          type: string
          description: |
            **Chụp lại lúc đặt.** Sửa tên tour sau này không làm đổi đơn cũ
            (`docs/23` mục 4.1).
        departDate: { type: string, format: date }
        total: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        balance: { $ref: '#/components/schemas/Money' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PriceLine' }

    SlugRedirect:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          description: |
            Slug hiện tại, **của locale đã yêu cầu**. Frontend ghép nó với đoạn
            đường dẫn của locale đó để dựng URL đích.
          example: vietnam-fra-nord-til-syd
    Theme:
      type: object
      required: [slug, name, productCount]
      properties:
        slug: { type: string, example: trekking }
        name: { type: string, example: Trekking }
        productCount: { type: integer, format: int32, minimum: 0 }

    ItineraryDay:
      type: object
      required: [dayNumber, title, description]
      properties:
        dayNumber: { type: integer, format: int32, minimum: 1 }
        title: { type: string }
        description: { type: string }
        destination:
          allOf: [{ $ref: '#/components/schemas/Ref' }]
          description: Nơi ngủ đêm. Bỏ khỏi JSON với ngày bay hoặc ngày trên tàu.
        hotelName:
          type: string
          description: Tên riêng, **không dịch**.

    HotelStay:
      type: object
      required: [name, nights, destination]
      properties:
        name:
          type: string
          description: Tên riêng của khách sạn, **không dịch** — `docs/24` mục 5.
        stars: { type: integer, format: int32, minimum: 1, maximum: 5 }
        nights: { type: integer, format: int32, minimum: 1 }
        destination: { $ref: '#/components/schemas/Ref' }
        description:
          type: string
          description: Phụ thuộc locale. Bỏ khỏi JSON khi chưa dịch.
        image: { type: string }

    DepartureStatus:
      type: string
      description: |
        Giá trị **tính ra**, không phải cột trong cơ sở dữ liệu. Thứ tự xét ở
        `docs/14` mục 5; `GUARANTEED` xét **trước** `FEW_SEATS`.
      enum: [OPEN, FEW_SEATS, GUARANTEED, SOLD_OUT, PENDING]

    Departure:
      type: object
      required: [id, departDate, returnDate, days, status, seatsAvailable]
      properties:
        id: { type: string, format: uuid }
        departDate: { type: string, format: date }
        returnDate: { type: string, format: date }
        days: { type: integer, format: int32 }
        status: { $ref: '#/components/schemas/DepartureStatus' }
        seatsAvailable:
          type: integer
          format: int32
          minimum: 0
          description: Đã trừ chỗ đang giữ — `docs/14` mục 6.1.
        priceFrom:
          allOf: [{ $ref: '#/components/schemas/Money' }]
        cabinCategory:
          type: string
          description: Chỉ `CRUISE`.
        departureCity:
          type: string
          description: Chỉ những thị trường có nhiều điểm khởi hành.

    PostSummary:
      type: object
      required: [slug, title, excerpt, tags]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        heroImage: { type: string }
        publishedAt: { type: string, format: date-time }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Ref' }

    PostPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PostSummary' }
        page: { type: integer, format: int32 }
        size: { type: integer, format: int32 }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer, format: int32 }

    PostDetail:
      type: object
      required: [slug, title, excerpt, body, tags]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        body:
          type: array
          items: { type: string }
          description: Từng đoạn văn một, không phải một khối HTML.
        heroImage: { type: string }
        publishedAt: { type: string, format: date-time }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Ref' }

    Lecture:
      type: object
      required: [id, eventDate, city, title, description, seats, seatsAvailable]
      properties:
        id: { type: string, format: uuid }
        eventDate: { type: string, format: date }
        startTime:
          type: string
          description: Giờ địa phương, dạng `HH:MM`.
        city: { type: string }
        venue: { type: string }
        title: { type: string }
        description: { type: string }
        seats: { type: integer, format: int32 }
        seatsAvailable:
          type: integer
          format: int32
          minimum: 0
          description: Giá trị tính ra — không có cờ "đã đầy" trong cơ sở dữ liệu.

    ProductType:
      type: string
      description: |
        Sáu loại sản phẩm, mỗi loại có bảng con riêng và ràng buộc nghiệp vụ
        riêng — `docs/04`. `PRIVATE_TOUR` **không đặt trực tiếp được**: CTA là
        "Yêu cầu báo giá".
      enum:
        - GROUP_TOUR
        - INDIVIDUAL_PACKAGE
        - PRIVATE_TOUR
        - CRUISE
        - COMBO
        - DAY_TOUR

    ProductSort:
      type: string
      description: Trường và chiều sắp xếp, phân tách bằng dấu phẩy — `docs/13` mục 6.
      enum:
        - 'title,asc'
        - 'title,desc'
        - 'priceFrom,asc'
        - 'priceFrom,desc'
        - 'durationDays,asc'
        - 'durationDays,desc'
      default: 'title,asc'

    Ref:
      type: object
      description: Tham chiếu tới một thực thể khác — chỉ slug và tên, đã dịch sang locale đang xem.
      required: [slug, name]
      properties:
        slug:
          type: string
          example: nordvietnam
        name:
          type: string
          example: Nordvietnam

    ProductSummary:
      type: object
      description: |
        Bản rút gọn dùng cho listing. **Không** chứa hành trình, khách sạn hay
        ngày khởi hành — những thứ đó chỉ có ở trang chi tiết, và ngày khởi hành
        thì không bao giờ được cache (`docs/13` mục 8).
      required: [slug, title, productType, shortDescription, heroImage, heroImageAlt, region, destination, isNew, reviewCount]
      properties:
        slug: { type: string, example: vietnam-fra-nord-til-syd }
        title: { type: string, example: Vietnam fra nord til syd }
        productType: { $ref: '#/components/schemas/ProductType' }
        shortDescription: { type: string }
        heroImage: { type: string }
        heroImageAlt:
          type: string
          description: Bắt buộc, và **phụ thuộc locale** — chữ alt cũng là nội dung phải dịch.
        durationDays:
          type: integer
          format: int32
          description: Bỏ hẳn khỏi JSON với `DAY_TOUR` — loại đó đo bằng giờ.
        region: { $ref: '#/components/schemas/Ref' }
        destination: { $ref: '#/components/schemas/Ref' }
        priceFrom:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |
            Giá **thấp nhất** của thị trường này, không phải giá đã quy đổi tỷ
            giá — mỗi thị trường có giá riêng do người nhập (`CLAUDE.md` điều 4).
            Chưa có bảng giá thì **bỏ hẳn** trường này, frontend hiện "Liên hệ".
        isNew: { type: boolean }
        rating:
          type: number
          format: double
          minimum: 1
          maximum: 5
        reviewCount: { type: integer, format: int32, minimum: 0 }

    ProductPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductSummary' }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1 }
        totalItems:
          type: integer
          format: int64
          minimum: 0
          description: |
            Đếm trong phạm vi `(market, locale)` sau khi đã áp bộ lọc. Đây là con
            số frontend phải hiển thị — "Xem tất cả 92 tour" không được hardcode.
        totalPages: { type: integer, format: int32, minimum: 0 }

    ProductDetailBase:
      type: object
      required: [slug, title, productType, shortDescription, longDescription, whyChooseThis, heroImage, heroImageAlt, region, destination, isNew, reviewCount]
      properties:
        slug: { type: string }
        title: { type: string }
        productType:
          # Cố tình là `string` trần chứ không $ref tới enum ProductType: đây là
          # trường phân loại (discriminator), và openapi-generator sinh interface
          # cha với kiểu String trong khi sinh lớp con với kiểu enum — hai chữ ký
          # không tương thích và Java không biên dịch được. Kiểu cụ thể đã nằm ở
          # chính lớp con rồi, nên không mất gì.
          type: string
          example: GROUP_TOUR
        shortDescription: { type: string }
        longDescription:
          type: array
          items: { type: string }
          description: Từng đoạn văn một, không phải một khối HTML.
        whyChooseThis:
          type: array
          items: { type: string }
          minItems: 3
          maxItems: 7
        heroImage: { type: string }
        heroImageAlt: { type: string }
        mapImage: { type: string }
        gallery:
          type: array
          items: { $ref: '#/components/schemas/GalleryImage' }
          description: |
            Bộ ảnh của sản phẩm, theo thứ tự biên tập viên đã sắp
            (`product_image.sort_order`). **Có thể rỗng** — sản phẩm chưa có ảnh
            nào là trạng thái hợp lệ, và template phải dựng được khi rỗng.

            Ảnh **không có `alt` ở locale đang đọc thì không xuất hiện**, đúng
            luật không fallback cho nội dung bán hàng (`CLAUDE.md` quy tắc 3).
            Đây là chỗ dễ thấy vô lý — "sao ảnh biến mất chỉ vì thiếu một câu mô
            tả" — nên nói rõ: một tấm ảnh không có `alt` là một tấm ảnh vô hình
            với đúng nhóm người phụ thuộc vào nó nhất (`24` mục 6). Hiện nó ra
            kèm `alt` của ngôn ngữ khác còn tệ hơn: trình đọc màn hình sẽ đọc một
            câu tiếng Đan giữa trang tiếng Việt.
        layout:
          type: string
          maxLength: 40
          description: |
            Template trang chi tiết mà biên tập viên đã chọn cho sản phẩm này.

            **Chuỗi tự do, cố ý không phải enum**, cùng lý do với `code` của
            `ErrorResponse`: thêm một template là việc của frontend, không đáng
            bắt sinh lại mã cả hai bên. Danh mục template nào hợp với loại nào
            do frontend giữ.

            Bỏ trống, hoặc mang giá trị không có trong danh mục, thì trang dựng
            bằng **template mặc định của loại** — không báo lỗi, không trang
            trắng. Đây là chủ ý: template bị gỡ đi mà sản phẩm cũ còn trỏ tới là
            chuyện chắc chắn xảy ra, và nó không được phép làm hỏng trang đang
            bán hàng.
        durationDays: { type: integer, format: int32 }
        region: { $ref: '#/components/schemas/Ref' }
        destination: { $ref: '#/components/schemas/Ref' }
        priceFrom:
          allOf: [{ $ref: '#/components/schemas/Money' }]
        isNew: { type: boolean }
        rating: { type: number, format: double }
        reviewCount: { type: integer, format: int32 }

    GalleryImage:
      type: object
      description: |
        Một tấm trong bộ ảnh.

        **`url` là địa chỉ đầy đủ, nhưng CSDL không lưu nó.** `media_asset.path`
        giữ đường dẫn tương đối (`tour/sapa-ruong-bac-thang-01.jpg`) và API ghép
        với địa chỉ gốc lấy từ cấu hình — ADR-011 mục 2, `12` mục 4.6. Lưu URL
        đầy đủ vào từng dòng dữ liệu là đóng cứng nhà cung cấp vào dữ liệu, và
        ngày đổi kho sẽ cần một migration thay vì một biến môi trường.
      required: [url, alt, width, height]
      properties:
        url: { type: string }
        alt:
          type: string
          description: Mô tả **tấm ảnh đang hiện**, theo locale ở `Accept-Language`.
        width: { type: integer, format: int32 }
        height:
          type: integer
          format: int32
          description: |
            Kèm `width` để frontend đặt chỗ trước, tránh trang nhảy khi ảnh tải
            xong. Hai giá trị này là kích thước **ảnh gốc**, không phải kích
            thước hiển thị.

    GroupTourDetail:
      description: Đoàn ghép có trưởng đoàn. `guaranteedThreshold` là số khách tối thiểu để chuyến chắc chắn khởi hành.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [minPax, maxPax, guaranteedThreshold, tourLeaderLanguage, fitnessLevel]
          properties:
            minPax: { type: integer, format: int32 }
            maxPax: { type: integer, format: int32 }
            guaranteedThreshold: { type: integer, format: int32 }
            tourLeaderLanguage:
              type: string
              description: |
                Ngôn ngữ của trưởng đoàn. **Không phải** locale khách đang đọc —
                khách Việt ở Đan Mạch đọc `vi` nhưng đi đoàn có trưởng đoàn nói `da`.
            fitnessLevel: { type: integer, format: int32, minimum: 1, maximum: 4 }

    IndividualPackageDetail:
      description: Gói cá nhân, khách tự chọn ngày trong cửa sổ linh hoạt.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [minPartySize, flexibleDateWindowDays]
          properties:
            minPartySize: { type: integer, format: int32 }
            flexibleDateWindowDays: { type: integer, format: int32 }

    PrivateTourDetail:
      description: |
        Tour riêng — **không đặt trực tiếp được**. Bấm CTA sinh một yêu cầu báo
        giá; giá cuối do tư vấn viên dựng.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [leadTimeDays, quoteValidDays]
          properties:
            leadTimeDays:
              type: integer
              format: int32
              description: Ngày khởi hành sớm hơn số ngày này thì trả `LEAD_TIME_NOT_MET`.
            quoteValidDays: { type: integer, format: int32 }

    CruiseDetail:
      description: Du thuyền. Ngày khởi hành trả **phẳng**, gộp theo ngày là việc của frontend.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [shipName, portCount]
          properties:
            shipName: { type: string }
            portCount: { type: integer, format: int32 }

    ComboDetail:
      description: Bó cố định do nhân viên soạn, chỉ bán trong khoảng ngày hiệu lực.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [nights, validFrom, validTo]
          properties:
            nights: { type: integer, format: int32 }
            validFrom: { type: string, format: date }
            validTo: { type: string, format: date }

    DayTourDetail:
      description: Tour trong ngày. Đo bằng **giờ**, nên `durationDays` không có mặt.
      allOf:
        - $ref: '#/components/schemas/ProductDetailBase'
        - type: object
          required: [durationHours, cutoffHours]
          properties:
            durationHours: { type: integer, format: int32 }
            cutoffHours:
              type: integer
              format: int32
              description: Số giờ trước khi khởi hành thì đóng nhận đặt.

    ProductDetail:
      description: |
        Kiểu tổng theo `productType` — ADR-005. Generator sinh ra union
        TypeScript và interface Java, nên **quên xử lý một loại là lỗi biên dịch**.
      oneOf:
        - $ref: '#/components/schemas/GroupTourDetail'
        - $ref: '#/components/schemas/IndividualPackageDetail'
        - $ref: '#/components/schemas/PrivateTourDetail'
        - $ref: '#/components/schemas/CruiseDetail'
        - $ref: '#/components/schemas/ComboDetail'
        - $ref: '#/components/schemas/DayTourDetail'
      discriminator:
        propertyName: productType
        mapping:
          GROUP_TOUR: '#/components/schemas/GroupTourDetail'
          INDIVIDUAL_PACKAGE: '#/components/schemas/IndividualPackageDetail'
          PRIVATE_TOUR: '#/components/schemas/PrivateTourDetail'
          CRUISE: '#/components/schemas/CruiseDetail'
          COMBO: '#/components/schemas/ComboDetail'
          DAY_TOUR: '#/components/schemas/DayTourDetail'

    Money:
      type: object
      description: |
        `amount` là **chuỗi**, không phải số JSON — số dấu phẩy động của
        JavaScript làm hỏng tiền. API không định dạng: không có "24.990 kr."
        ở bất kỳ đâu trong phản hồi.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?\d+(\.\d+)?$'
          example: '24990.00'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: DKK

    ErrorResponse:
      type: object
      description: Mã lỗi kèm tham số. Frontend dịch — backend không trả câu tiếng người.
      required: [code]
      properties:
        code:
          type: string
          example: NOT_FOUND
        params:
          type: object
          additionalProperties: true
        traceId:
          type: string
