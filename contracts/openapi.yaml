      description: |
        Quyền phụ thuộc **cả vai trò lẫn locale**: `EDITOR` sửa bản nguồn,
        `TRANSLATOR` sửa bản dịch, `ADMIN` sửa cả hai (`docs/22` mục 2.1 điều 2).
        Người dịch sửa bản nguồn là làm hai bản lệch nhau mà không ai biết bản
        nào đúng.
      parameters:
        - $ref: '#/components/parameters/AdminId'
        - name: locale
          in: path
          required: true
          schema: { type: string, enum: [da, vi] }
      requestBody:
        required: true
