        Lý do là một giới hạn thật của bộ sinh mã, không phải sở thích: trường
        mảng vắng mặt trong JSON được dựng thành **danh sách rỗng**, nên
        `{"heroImage":"…"}` và `{"tagIds":[]}` tới tay controller giống hệt nhau.
        Gộp thẻ vào `PATCH` nghĩa là đổi mỗi cái ảnh bìa cũng lặng lẽ gỡ sạch thẻ
        của bài. Tách ra thì mỗi endpoint nói đúng một việc, và cùng khuôn với
        `price-tiers`, `prices` và `roles` — tất cả đều `PUT` thay toàn bộ.
      parameters: [{ $ref: '#/components/parameters/AdminId' }]
